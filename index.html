    <script>
        const DB_NAME = 'HayatOSDB';
        const DB_VERSION = 3;
        let db = null;

        function initDB() {
            return new Promise((resolve, reject) => {
                if (db) return resolve(db);
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = (e) => reject("ডেটাবেস ত্রুটি: " + e.target.errorCode);
                request.onsuccess = (e) => { db = e.target.result; resolve(db); };
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('todos')) db.createObjectStore('todos', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('habits')) db.createObjectStore('habits', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('vocab')) db.createObjectStore('vocab', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('sentences')) db.createObjectStore('sentences', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('conversations')) db.createObjectStore('conversations', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('diary')) db.createObjectStore('diary', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('goals')) db.createObjectStore('goals', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('health')) db.createObjectStore('health', { keyPath: 'date' });
                    if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
                };
            });
        }

        function dbPut(storeName, data) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const req = store.put(data);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function dbGetAll(storeName) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readonly');
                const store = tx.objectStore(storeName);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function dbGet(storeName, key) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readonly');
                const store = tx.objectStore(storeName);
                const req = store.get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function dbDelete(storeName, key) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const req = store.delete(key);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        let currentTab = 'dashboard';
        let currentQuizIndex = 0;
        let vocabSearchQuery = '';
        let sentenceSearchQuery = '';
        const cardStepsState = {}; 
        const sentenceStepsState = {};
        const conversationExpandedState = {}; // Tracks open/close state of conversation topics
        const dialogueStepState = {}; // Tracks step state for each conversation line: 'id_lineIndex' -> 0, 1, 2

        const getTodayDateStr = () => new Date().toISOString().split('T')[0];

        function getBengaliFormattedDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return new Date().toLocaleDateString('bn-BD', options);
        }

        function toBengaliNumerals(num) {
            if (num === null || num === undefined) return '';
            const bengaliDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return num.toString().replace(/\d/g, (x) => bengaliDigits[x]);
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `p-3 rounded-xl shadow-xl text-xs font-semibold flex items-center gap-2 border transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto bg-navy-800 text-white border-gold-500/40`;
            toast.innerHTML = `<i class="fa-solid fa-circle-info text-gold-500"></i> <span>${message}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                icon.className = 'fa-solid fa-sun';
                localStorage.setItem('hayat_theme', 'light');
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                icon.className = 'fa-solid fa-moon';
                localStorage.setItem('hayat_theme', 'dark');
            }
        }

        function loadThemePreference() {
            const saved = localStorage.getItem('hayat_theme') || 'dark';
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (saved === 'light') {
                html.classList.remove('dark');
                html.classList.add('light');
                if(icon) icon.className = 'fa-solid fa-sun';
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                if(icon) icon.className = 'fa-solid fa-moon';
            }
        }

        function toggleQuickModal() {

        function switchTab(tabId) {

            switch(tabId) {

                case 'study': renderStudyView(); break;
                case 'sentences': renderSentencesView(); break;
                case 'conversations': renderConversationsView(); break;
                case 'todo': renderTodoView(); break;
                case 'habits': renderHabitsView(); break;
                case 'health': renderHealthView(); break;
                case 'diary': renderDiaryView(); break;
                case 'settings': renderSettingsView(); break;
                case 'sub_vocab_quiz': renderVocabQuizView(); break;
                default: renderDashboardView();

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

                    </div>

        // --- STUDY & VOCABULARY MODULE ---
        async function renderStudyView() {
            const allVocabs = await dbGetAll('vocab');
            const vocabs = allVocabs.filter(item => {
                if (!vocabSearchQuery) return true;
                const q = vocabSearchQuery.toLowerCase();
                return (item.word && item.word.toLowerCase().includes(q)) ||
                       (item.meaning && item.meaning.toLowerCase().includes(q)) ||
                       (item.pronunciation && item.pronunciation.toLowerCase().includes(q));
            });

            document.getElementById('app-content').innerHTML = `
                <div class="flex items-center justify-between mb-2">
                    <h2 class="text-xl font-bold gold-gradient-text flex items-center gap-2">
                        <i class="fa-solid fa-book-open"></i> English Vocabulary Hub

        function getCardStepHTML(item, step) {
            if (step === 0) {
                return `
                    <div class="text-[10px] text-gold-400 uppercase tracking-widest font-bold mb-1">১. English Word</div>
                    <h4 class="text-2xl font-bold text-white light:text-slate-800 tracking-wide">${item.word}</h4>
                    <span class="text-[10px] text-slate-400 block mt-2">পরবর্তী ধাপ দেখতে ক্লিক করুন ⟳</span>
                `;
            } else if (step === 1) {
                return `
                    <div class="text-[10px] text-gold-400 uppercase tracking-widest font-bold mb-1">২. বাংলা উচ্চারণ</div>
                    <div class="text-xl font-bold text-gold-300">${item.pronunciation || 'উচ্চারণ দেয়া হয়নি'}</div>
                `;
            } else if (step === 2) {
                return `
                    <div class="text-[10px] text-gold-400 uppercase tracking-widest font-bold mb-1">৩. বাংলা অর্থ</div>
                    <div class="text-base font-semibold text-slate-100 light:text-slate-800 whitespace-pre-line">${item.meaning}</div>
                `;
            } else if (step === 3) {
                const sentence = item.sentence || 'কোনো উদাহরণ বাক্য নেই।';
                const translation = item.translation ? `<div class="text-gold-300/90 text-xs mt-1 font-normal">(${item.translation})</div>` : '';
                return `
                    <div class="text-[10px] text-gold-400 uppercase tracking-widest font-bold mb-1">৪. Example Sentence</div>
                    <div class="text-xs text-slate-200 light:text-slate-700 italic px-2">"${sentence}"</div>
                    ${translation}
                `;
            }
        }

        function nextCardStep(id) { changeCardStep(id, 1); }
        function changeCardStep(id, direction) {
            let currentStep = cardStepsState[id] || 0;
            let nextStep = (currentStep + direction) % 4;
            if (nextStep < 0) nextStep = 3;
            setCardStep(id, nextStep);
        }

        async function setCardStep(id, targetStep) {
            cardStepsState[id] = targetStep;
            const contentArea = document.getElementById(`card-content-${id}`);
            const dotsArea = document.getElementById(`card-dots-${id}`);
            if (!contentArea) return;
            contentArea.style.opacity = '0';
            contentArea.style.transform = 'translateY(4px)';
            setTimeout(async () => {
                const item = await dbGet('vocab', id);
                if (item) {
                    contentArea.innerHTML = getCardStepHTML(item, targetStep);
                    contentArea.style.opacity = '1';
                    contentArea.style.transform = 'translateY(0px)';
                }
            }, 150);
            if (dotsArea) {
                const dots = dotsArea.children;
                for (let i = 0; i < dots.length; i++) {
                    dots[i].className = i === targetStep ? 'w-2 h-2 rounded-full cursor-pointer transition-all duration-300 bg-gold-500 scale-125' : 'w-2 h-2 rounded-full cursor-pointer transition-all duration-300 bg-slate-600 hover:bg-slate-400';
                }
            }
        }

        function handleVocabSearch(query) { vocabSearchQuery = query; renderStudyView(); }

        async function saveVocab() {
            const idInput = document.getElementById('vocab-id').value;
            const word = document.getElementById('vocab-word').value.trim();
            const pronunciation = document.getElementById('vocab-pronunciation').value.trim();
            const meaning = document.getElementById('vocab-meaning').value.trim();
            const sentence = document.getElementById('vocab-sentence').value.trim();
            const translation = document.getElementById('vocab-translation').value.trim();

            if (!word || !meaning) { showToast('অনুগ্রহ করে ইংরেজি শব্দ এবং অর্থ প্রদান করুন'); return; }
            const id = idInput ? idInput : Date.now().toString();
            await dbPut('vocab', { id, word, pronunciation, meaning, sentence, translation });
            showToast(idInput ? 'শব্দ হালনাগাদ করা হয়েছে!' : 'নতুন শব্দ সংরক্ষিত হয়েছে!');
            resetVocabForm();
            renderStudyView();
        }

        function editVocab(id, word, pronunciation, meaning, sentence, translation) {
            document.getElementById('vocab-id').value = id;
            document.getElementById('vocab-word').value = decodeURIComponent(word);
            document.getElementById('vocab-pronunciation').value = decodeURIComponent(pronunciation);
            document.getElementById('vocab-meaning').value = decodeURIComponent(meaning);
            document.getElementById('vocab-sentence').value = decodeURIComponent(sentence || '');
            document.getElementById('vocab-translation').value = decodeURIComponent(translation || '');
            document.getElementById('form-title').innerText = 'শব্দ সম্পাদনা করুন';
            document.getElementById('vocab-save-btn').innerText = 'হালনাগাদ করুন';
            document.getElementById('vocab-cancel-btn').classList.remove('hidden');
            window.scrollTo({ top: 100, behavior: 'smooth' });
        }

        function resetVocabForm() {
            document.getElementById('vocab-id').value = '';
            document.getElementById('vocab-word').value = '';
            document.getElementById('vocab-pronunciation').value = '';
            document.getElementById('vocab-meaning').value = '';
            document.getElementById('vocab-sentence').value = '';
            document.getElementById('vocab-translation').value = '';
            document.getElementById('form-title').innerText = 'নতুন শব্দ যোগ করুন';
            document.getElementById('vocab-save-btn').innerText = 'শব্দ সংরক্ষণ করুন';
            document.getElementById('vocab-cancel-btn').classList.add('hidden');
        }

        async function deleteVocab(id) {
            await dbDelete('vocab', id);
            delete cardStepsState[id];
            showToast('কার্ড মুছে ফেলা হয়েছে');
            renderStudyView();
        }

        }

        function getSentenceStepHTML(item, step) {
            if (step === 0) {
                return `
                    <div class="text-[10px] text-gold-400 uppercase tracking-widest font-bold mb-1">১. ইংরেজি বাক্য</div>
                    <h4 class="text-lg font-bold text-white light:text-slate-800 tracking-wide">"${item.sentence}"</h4>
                    <span class="text-[10px] text-slate-400 block mt-2">পরবর্তী ধাপ দেখতে ক্লিক করুন ⟳</span>
                `;
            } else if (step === 1) {
                return `
                    <div class="text-[10px] text-gold-400 uppercase tracking-widest font-bold mb-1">২. বাংলা উচ্চারণ</div>
                    <div class="text-base font-bold text-gold-300">${item.pronunciation || 'উচ্চারণ দেয়া হয়নি'}</div>
                `;
            } else if (step === 2) {
                return `
                    <div class="text-[10px] text-gold-400 uppercase tracking-widest font-bold mb-1">৩. বাংলা অর্থ</div>
                    <div class="text-sm font-semibold text-slate-100 light:text-slate-800 whitespace-pre-line">${item.meaning}</div>
                `;
            }
        }

        function nextSentenceStep(id) { changeSentenceStep(id, 1); }
        function changeSentenceStep(id, direction) {
            let currentStep = sentenceStepsState[id] || 0;
            let nextStep = (currentStep + direction) % 3;
            if (nextStep < 0) nextStep = 2;
            setSentenceStep(id, nextStep);
        }

        async function setSentenceStep(id, targetStep) {
            sentenceStepsState[id] = targetStep;
            const contentArea = document.getElementById(`sentence-content-${id}`);
            const dotsArea = document.getElementById(`sentence-dots-${id}`);
            if (!contentArea) return;
            contentArea.style.opacity = '0';
            contentArea.style.transform = 'translateY(4px)';
            setTimeout(async () => {
                const item = await dbGet('sentences', id);
                if (item) {
                    contentArea.innerHTML = getSentenceStepHTML(item, targetStep);
                    contentArea.style.opacity = '1';
                    contentArea.style.transform = 'translateY(0px)';
                }
            }, 150);
            if (dotsArea) {
                const dots = dotsArea.children;
                for (let i = 0; i < dots.length; i++) {
                    dots[i].className = i === targetStep ? 'w-2 h-2 rounded-full cursor-pointer transition-all duration-300 bg-gold-500 scale-125' : 'w-2 h-2 rounded-full cursor-pointer transition-all duration-300 bg-slate-600 hover:bg-slate-400';
                }
            }
        }

                    </div>

                    <div class="glass-card p-5 rounded-2xl border-gold-500/30 space-y-3">
                        <span class="text-[10px] text-gold-500 uppercase font-bold">দ্বিতীয় পদ্ধতি: নিজে ইংরেজি লেখা</span>
                        <div class="bg-navy-900/60 p-4 rounded-xl text-center">
                            <span class="text-xs text-slate-400">বাংলা অর্থ</span>
                            <h3 class="text-xl font-bold text-white mt-1">${currentItem.meaning}</h3>
                        </div>
                        <input id="quiz-user-input" type="text" placeholder="আপনার উত্তর এখানে লিখুন..." class="w-full p-3 rounded-xl bg-navy-900/80 border border-gold-500/20 text-xs text-white focus:outline-none">
                        <div id="quiz-verify-result" class="hidden p-3 rounded-xl text-xs font-semibold text-center"></div>
                        <button onclick="verifyQuizAnswer('${currentItem.word.replace(/'/g, "\\'")}')" class="w-full py-3 rounded-xl bg-gradient-to-r from-teal-600 to-emerald-600 text-white font-bold text-xs uppercase shadow-md">উত্তর যাচাই করুন</button>
                    </div>
                </div>
            `;
        }

        function toggleQuizAnswer() { document.getElementById('quiz-answer-display')?.classList.toggle('hidden'); }
        function nextQuizQuestion(total) { currentQuizIndex = (currentQuizIndex + 1) % total; renderVocabQuizView(); }
        function verifyQuizAnswer(correctAnswer) {
            const userInput = document.getElementById('quiz-user-input').value.trim().toLowerCase();
            const target = correctAnswer.trim().toLowerCase();
            const resultBox = document.getElementById('quiz-verify-result');
            if (!userInput) { showToast('অনুগ্রহ করে ইংরেজি শব্দটি লিখুন!'); return; }
            resultBox.classList.remove('hidden', 'bg-emerald-500/20', 'text-emerald-300', 'border-emerald-500/30', 'bg-red-500/20', 'text-red-300', 'border-red-500/30');
            if (userInput === target) {
                resultBox.classList.add('bg-emerald-500/20', 'text-emerald-300', 'border', 'border-emerald-500/30');
                resultBox.innerHTML = `<i class="fa-solid fa-circle-check"></i> চমৎকার! সঠিক উত্তর হয়েছে (${correctAnswer})।`;
                showToast('সঠিক উত্তর!');
            } else {
                resultBox.classList.add('bg-red-500/20', 'text-red-300', 'border', 'border-red-500/30');
                resultBox.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> ভুল হয়েছে! সঠিক উত্তর: <strong class="underline">${correctAnswer}</strong>`;
                showToast('সঠিক হয়নি');
            }
        }

        // --- OTHER MODULES ---
        async function renderTodoView() {
            const todos = await dbGetAll('todos');
            document.getElementById('app-content').innerHTML = `
                <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold gold-gradient-text"><i class="fa-solid fa-list-check"></i> কাজের তালিকা ও রুটিন</h2></div>
                <div class="glass-card p-4 rounded-2xl flex gap-2">
                    <input id="todo-input" type="text" placeholder="নতুন কাজ..." class="flex-1 p-3 rounded-xl bg-navy-900/60 border border-gold-500/20 text-xs focus:outline-none">
                    <button onclick="addTodo()" class="px-5 rounded-xl bg-gold-500 text-navy-900 font-bold text-xs">যোগ</button>
                </div>
                <div class="glass-card p-5 rounded-2xl space-y-2">
                    ${todos.map(t => `<div class="p-3 rounded-xl bg-navy-700/40 flex justify-between items-center text-xs"><label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" onchange="toggleTodo('${t.id}')" ${t.completed?'checked':''} class="accent-amber-500"><span class="${t.completed?'line-through text-slate-400':''}">${t.title}</span></label><button onclick="deleteTodo('${t.id}')" class="text-red-400"><i class="fa-solid fa-trash"></i></button></div>`).join('')}
                </div>
            `;
        }
        async function addTodo() {
            const title = document.getElementById('todo-input').value.trim();
            if(!title) return;
            await dbPut('todos', { id: Date.now().toString(), title, completed: false });
            renderTodoView();
        }
        async function toggleTodo(id) { const t = await dbGet('todos', id); if(t) { t.completed = !t.completed; await dbPut('todos', t); renderTodoView(); } }
        async function deleteTodo(id) { await dbDelete('todos', id); renderTodoView(); }

        async function renderHabitsView() {
            const habits = await dbGetAll('habits');
            document.getElementById('app-content').innerHTML = `
                <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold gold-gradient-text"><i class="fa-solid fa-chart-line"></i> অভ্যাস ট্র্যাকার</h2></div>
                <div class="glass-card p-4 rounded-2xl flex gap-2">
                    <input id="habit-title" type="text" placeholder="অভ্যাস..." class="flex-1 p-3 rounded-xl bg-navy-900/60 border border-gold-500/20 text-xs focus:outline-none">
                    <button onclick="addHabit()" class="px-5 rounded-xl bg-gold-500 text-navy-900 font-bold text-xs">তৈরি</button>
                </div>
                <div class="glass-card p-5 rounded-2xl space-y-2">
                    ${habits.map(h => `<div class="p-3 rounded-xl bg-navy-700/40 flex justify-between items-center text-xs"><span>${h.title} (স্ট্রীক: ${toBengaliNumerals(h.streak||0)} দিন)[span_13](start_span)[span_13](end_span)</span><div class="flex gap-2"><button onclick="incrementStreak('${h.id}')" class="px-2.5 py-1 bg-gold-500/20 text-gold-400 rounded-lg">সম্পন্ন</button><button onclick="deleteHabit('${h.id}')" class="text-red-400"><i class="fa-solid fa-trash"></i></button></div></div>`).join('')}
                </div>
            `;
        }
        async function addHabit() {
            const title = document.getElementById('habit-title').value.trim();
            if(!title) return;
            await dbPut('habits', { id: Date.now().toString(), title, streak: 0 });
            renderHabitsView();
        }
        async function incrementStreak(id) { const h = await dbGet('habits', id); if(h) { h.streak = (h.streak||0) + 1; await dbPut('habits', h); showToast('স্ট্রীক হালনাগাদ হয়েছে!'); renderHabitsView(); } }
        async function deleteHabit(id) { await dbDelete('habits', id); renderHabitsView(); }

        async function renderHealthView() {
            const today = getTodayDateStr();
            let health = (await dbGet('health', today)) || { water: 0, steps: 0, sleep: 0 };
            document.getElementById('app-content').innerHTML = `
                <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold gold-gradient-text"><i class="fa-solid fa-heart-pulse"></i> ফিটনেস ট্র্যাকার</h2></div>
                <div class="glass-card p-5 rounded-2xl space-y-4 text-xs">
                    <div class="flex justify-between font-bold text-slate-200"><span>পানি গ্রহণ</span><span class="text-blue-400">${toBengaliNumerals(health.water)} মি.লি.[span_14](start_span)[span_14](end_span)</span></div>
                    <div class="w-full bg-navy-900 h-3 rounded-full overflow-hidden border border-blue-500/20"><div class="bg-blue-500 h-full" style="width: ${Math.min(100, (health.water/2000)*100)}%"></div></div>
                    <div class="flex gap-2"><button onclick="addWater(250)" class="flex-1 py-2 bg-blue-500/20 text-blue-300 rounded-xl">+২৫০ মি.লি.</button><button onclick="addWater(500)" class="flex-1 py-2 bg-blue-500/20 text-blue-300 rounded-xl">+৫০০ মি.লি.</button><button onclick="resetWater()" class="px-3 bg-navy-700 text-slate-300 rounded-xl">রিসেট</button></div>
                </div>
            `;
        }
        async function addWater(amount) {
            const today = getTodayDateStr();
            let h = (await dbGet('health', today)) || { date: today, water: 0 };
            h.water = (h.water || 0) + amount;
            await dbPut('health', h);
            renderHealthView();
        }
        async function resetWater() {
            const today = getTodayDateStr();
            let h = (await dbGet('health', today)) || { date: today, water: 0 };
            h.water = 0;
            await dbPut('health', h);
            renderHealthView();
        }

        async function renderDiaryView() {
            const entries = await dbGetAll('diary');
            document.getElementById('app-content').innerHTML = `
                <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold gold-gradient-text"><i class="fa-solid fa-book-bookmark"></i> ব্যক্তিগত ডায়েরি</h2></div>
                <div class="glass-card p-5 rounded-2xl space-y-3">
                    <input id="diary-title" type="text" placeholder="শিরোনাম..." class="w-full p-3 rounded-xl bg-navy-900/60 border border-gold-500/20 text-xs focus:outline-none">
                    <textarea id="diary-content" placeholder="অনুভূতি বা চিন্তাভাবনা..." class="w-full p-3 rounded-xl bg-navy-900/60 border border-gold-500/20 text-xs focus:outline-none" rows="3"></textarea>
                    <button onclick="saveDiary()" class="w-full py-2.5 rounded-xl bg-gold-500 text-navy-900 font-bold text-xs">সংরক্ষণ</button>
                </div>
                <div class="space-y-3">
                    ${entries.map(e => `<div class="glass-card p-4 rounded-xl text-xs space-y-1"><h4 class="font-bold text-gold-400">${e.title}</h4><p class="text-slate-300">${e.content}</p><div class="text-right"><button onclick="deleteDiary('${e.id}')" class="text-red-400 text-[10px]">মুছে ফেলুন</button></div></div>`).join('')}
                </div>
            `;
        }
        async function saveDiary() {
            const title = document.getElementById('diary-title').value.trim();
            const content = document.getElementById('diary-content').value.trim();
            if(!title || !content) return;
            await dbPut('diary', { id: Date.now().toString(), title, content, timestamp: new Date().toISOString() });
            renderDiaryView();
        }
        async function deleteDiary(id) { await dbDelete('diary', id); renderDiaryView(); }

        async function renderSettingsView() {
            const profile = (await dbGet('settings', 'profile')) || { name: 'সাইফুল ইসলাম', motto: 'নিরবচ্ছিন্ন আত্মউন্নয়ন' };
            document.getElementById('app-content').innerHTML = `
                <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold gold-gradient-text"><i class="fa-solid fa-sliders"></i> প্রোফাইল সেটিংস</h2></div>
                <div class="glass-card p-5 rounded-2xl space-y-3 text-xs">
                    <label class="text-slate-400">নাম</label>
                    <input id="set-name" type="text" value="${profile.name}" class="w-full p-2.5 rounded-xl bg-navy-900 border border-gold-500/20 text-white">
                    <label class="text-slate-400">নীতিবাক্য (Motto)</label>
                    <input id="set-motto" type="text" value="${profile.motto}" class="w-full p-2.5 rounded-xl bg-navy-900 border border-gold-500/20 text-white">
                    <button onclick="saveProfile()" class="py-2.5 px-4 bg-gold-500 text-navy-900 font-bold rounded-xl w-full">সংরক্ষণ করুন</button>
                </div>
            `;
        }
        async function saveProfile() {
            const name = document.getElementById('set-name').value;
            const motto = document.getElementById('set-motto').value;
            await dbPut('settings', { key: 'profile', name, motto });
            showToast('প্রোফাইল সংরক্ষিত হয়েছে');
        }

        // --- INIT ---
        window.addEventListener('DOMContentLoaded', async () => {
            loadThemePreference();
            await initDB();
            switchTab('dashboard');
        });
    </script>
</body>
</html>
