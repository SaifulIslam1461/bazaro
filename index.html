    <script>
        const DB_NAME = 'HayatOSDB';
        const DB_VERSION = 2;
        let db = null;

        function initDB() {
            return new Promise((resolve, reject) => {
                if (db) return resolve(db);
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = (e) => reject("ডেটাবেস ত্রুটি: " + e.target.errorCode);
                request.onsuccess = (e) => { db = e.target.result; resolve(db); };
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('todos')) db.createObjectStore('todos', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('habits')) db.createObjectStore('habits', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('vocab')) db.createObjectStore('vocab', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('diary')) db.createObjectStore('diary', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('goals')) db.createObjectStore('goals', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('health')) db.createObjectStore('health', { keyPath: 'date' });
                    if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
                    if (!db.objectStoreNames.contains('conv_topics')) db.createObjectStore('conv_topics', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('conv_messages')) db.createObjectStore('conv_messages', { keyPath: 'id' });
                };
            });
        }

        function dbPut(storeName, data) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const req = store.put(data);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function dbGetAll(storeName) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readonly');
                const store = tx.objectStore(storeName);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function dbGet(storeName, key) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readonly');
                const store = tx.objectStore(storeName);
                const req = store.get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function dbDelete(storeName, key) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const req = store.delete(key);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        let currentTab = 'dashboard';
        let currentQuizIndex = 0;
        let selectedTopicId = null;

        const getTodayDateStr = () => new Date().toISOString().split('T')[0];

        function getBengaliFormattedDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return new Date().toLocaleDateString('bn-BD', options);
        }

        function toBengaliNumerals(num) {
            if (num === null || num === undefined) return '';
            const bengaliDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return num.toString().replace(/\d/g, (x) => bengaliDigits[x]);
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `p-3 rounded-xl shadow-xl text-xs font-semibold flex items-center gap-2 border transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto bg-navy-800 text-white border-gold-500/40`;
            toast.innerHTML = `<i class="fa-solid fa-circle-info text-gold-500"></i> <span>${message}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                icon.className = 'fa-solid fa-sun';
                localStorage.setItem('hayat_theme', 'light');
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                icon.className = 'fa-solid fa-moon';
                localStorage.setItem('hayat_theme', 'dark');
            }
        }

        function loadThemePreference() {
            const saved = localStorage.getItem('hayat_theme') || 'dark';
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (saved === 'light') {
                html.classList.remove('dark');
                html.classList.add('light');
                if(icon) icon.className = 'fa-solid fa-sun';
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                if(icon) icon.className = 'fa-solid fa-moon';
            }
        }

        function toggleQuickModal() {
            document.getElementById('quick-modal').classList.toggle('hidden');
        }

        function toggleGeneralModal(show = true) {
            const modal = document.getElementById('general-modal');
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');

        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const activeNav = document.getElementById(`nav-${tabId}`);

            const content = document.getElementById('app-content');

            switch(tabId) {
                case 'dashboard': renderDashboardView(); break;
                case 'study': renderStudyView(); break;
                case 'todo': renderTodoView(); break;
                case 'habits': renderHabitsView(); break;
                case 'health': renderHealthView(); break;
                case 'diary': renderDiaryView(); break;
                case 'settings': renderSettingsView(); break;
                case 'sub_vocab_quiz': renderVocabQuizView(); break;
                case 'sub_conversations': renderConversationsView(); break;

            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function rotateCard(cardEl) {
            let state = parseInt(cardEl.getAttribute('data-state') || '0');
            state = (state + 1) % 4; 
            cardEl.setAttribute('data-state', state);

            const word = cardEl.querySelector('.d-word').innerText;
            const pronunciation = cardEl.querySelector('.d-pronunciation').innerText;
            const meaning = cardEl.querySelector('.d-meaning').innerText;
            const sentenceHTML = cardEl.querySelector('.d-sentence').innerHTML;
            
            const contentArea = cardEl.querySelector('.card-content-area');
            const stepLabel = cardEl.querySelector('.card-step-label');

            if (state === 0) {
                stepLabel.innerText = "১. মূল শব্দ";
                contentArea.innerHTML = `<h4 class="text-2xl font-bold text-white light:text-slate-800 tracking-wide">${word}</h4>`;
            } else if (state === 1) {
                stepLabel.innerText = "২. উচ্চারণ";
                contentArea.innerHTML = `
                    <div class="text-xs text-slate-400">উচ্চারণ:</div>
                    <div class="text-lg font-bold text-gold-400 mt-1">${pronunciation}</div>
                `;
            } else if (state === 2) {
                stepLabel.innerText = "৩. অর্থসমূহ";
                contentArea.innerHTML = `
                    <div class="text-xs text-slate-400">অর্থ:</div>
                    <div class="text-sm font-semibold text-slate-200 light:text-slate-800 mt-1 whitespace-pre-line">${meaning}</div>
                `;
            } else if (state === 3) {
                stepLabel.innerText = "৪. উদাহরণ বাক্য";
                contentArea.innerHTML = `
                    <div class="text-xs text-slate-400 mb-1">উদাহরণসমূহ:</div>
                    <div class="text-xs text-left max-h-24 overflow-y-auto px-2">${sentenceHTML}</div>
                `;
            }
        }

        async function saveVocab() {
            const idInput = document.getElementById('vocab-id').value;
            const word = document.getElementById('vocab-word').value.trim();
            const pronunciation = document.getElementById('vocab-pronunciation').value.trim();
            const meaning = document.getElementById('vocab-meaning').value.trim();
            const sentence = document.getElementById('vocab-sentence').value.trim();

            if (!word || !meaning) {
                showToast('অনুগ্রহ করে শব্দ এবং অর্থ প্রদান করুন');
                return;
            }

            const id = idInput ? idInput : Date.now().toString();
            await dbPut('vocab', { id, word, pronunciation, meaning, sentence });
            showToast(idInput ? 'শব্দ হালনাগাদ করা হয়েছে!' : 'নতুন শব্দ সংরক্ষিত হয়েছে!');
            resetVocabForm();
            renderStudyView();
        }

        function editVocab(id, word, pronunciation, meaning, sentence) {
            document.getElementById('vocab-id').value = id;
            document.getElementById('vocab-word').value = decodeURIComponent(word);
            document.getElementById('vocab-pronunciation').value = decodeURIComponent(pronunciation);
            document.getElementById('vocab-meaning').value = decodeURIComponent(meaning);
            document.getElementById('vocab-sentence').value = decodeURIComponent(sentence);
            document.getElementById('vocab-save-btn').innerText = 'হালনাগাদ করুন';
            document.getElementById('vocab-cancel-btn').classList.remove('hidden');
            window.scrollTo({ top: 100, behavior: 'smooth' });
        }

        function resetVocabForm() {
            document.getElementById('vocab-id').value = '';
            document.getElementById('vocab-word').value = '';
            document.getElementById('vocab-pronunciation').value = '';
            document.getElementById('vocab-meaning').value = '';
            document.getElementById('vocab-sentence').value = '';
            document.getElementById('vocab-save-btn').innerText = 'শব্দ সংরক্ষণ করুন';
            document.getElementById('vocab-cancel-btn').classList.add('hidden');
        }

        async function deleteVocab(id) {
            await dbDelete('vocab', id);
            showToast('কার্ড মুছে ফেলা হয়েছে');
            renderStudyView();
        }

        function toggleQuizAnswer() {
            const display = document.getElementById('quiz-answer-display');
            if (display) display.classList.toggle('hidden');
        }

        function nextQuizQuestion(total) {
            currentQuizIndex = (currentQuizIndex + 1) % total;
            renderVocabQuizView();
        }

        function verifyQuizAnswer(correctAnswer) {
            const userInput = document.getElementById('quiz-user-input').value.trim().toLowerCase();
            const target = correctAnswer.trim().toLowerCase();
            const resultBox = document.getElementById('quiz-verify-result');

            if (!userInput) {
                showToast('অনুগ্রহ করে ইংরেজি শব্দটি লিখুন!');
                return;
            }

            resultBox.classList.remove('hidden', 'bg-emerald-500/20', 'text-emerald-300', 'border-emerald-500/30', 'bg-red-500/20', 'text-red-300', 'border-red-500/30');

            if (userInput === target) {
                resultBox.classList.add('bg-emerald-500/20', 'text-emerald-300', 'border', 'border-emerald-500/30');
                resultBox.innerHTML = `<i class="fa-solid fa-circle-check"></i> চমৎকার! সঠিক উত্তর হয়েছে (${correctAnswer})।`;
                showToast('সঠিক উত্তর!');
            } else {
                resultBox.classList.add('bg-red-500/20', 'text-red-300', 'border', 'border-red-500/30');
                resultBox.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> ভুল হয়েছে! সঠিক উত্তর: <strong class="underline">${correctAnswer}</strong>`;
                showToast('সঠিক হয়নি, আবার চেষ্টা করুন');
            }
        }

        // --- SUB VIEW 2: CONVERSATIONS SECTION ---
        async function renderConversationsView() {
            let topics = await dbGetAll('conv_topics');
            if (topics.length === 0) {
                const defaultTopic = { id: 'top_1', title: 'কেনাকাটা (Shopping)', subtitle: 'দোকানদারের সাথে কথা বলা' };
                await dbPut('conv_topics', defaultTopic);
                topics = [defaultTopic];
            }

            if (!selectedTopicId || !topics.some(t => t.id === selectedTopicId)) {
                selectedTopicId = topics[0].id;
            }

            const activeTopic = topics.find(t => t.id === selectedTopicId);
            const allMessages = await dbGetAll('conv_messages');
            const topicMessages = allMessages.filter(m => m.topicId === selectedTopicId);

            if (topicMessages.length === 0 && selectedTopicId === 'top_1') {
                const m1 = { id: 'm1', topicId: 'top_1', speaker: 'Buyer', en: 'How much is this shirt?', bn: 'এই শার্টটির দাম কত?' };
                const m2 = { id: 'm2', topicId: 'top_1', speaker: 'Seller', en: 'It is 500 Taka.', bn: 'এটার দাম ৫০০ টাকা।' };
                await dbPut('conv_messages', m1);
                await dbPut('conv_messages', m2);
                topicMessages.push(m1, m2);
            }

            document.getElementById('app-content').innerHTML = `
                <div class="flex items-center justify-between mb-4">
                    <button onclick="switchTab('study')" class="text-xs text-gold-400 hover:underline flex items-center gap-1">
                        <i class="fa-solid fa-arrow-left"></i> ইংরেজি হাব এ ফিরে যান
                    </button>
                    <span class="text-xs font-bold text-gold-400">কথোপকথন হাব</span>
                </div>

                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="text-sm font-bold text-slate-200">বিষয়সমূহ</h3>
                        <button onclick="openAddTopicModal()" class="px-3 py-1.5 rounded-xl bg-gold-500 text-navy-900 font-bold text-xs hover:brightness-110 shadow">
                            + নতুন বিষয়
                        </button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        ${topics.map(t => `
                            <div onclick="selectConvTopic('${t.id}')" class="glass-card p-4 rounded-2xl flex justify-between items-center cursor-pointer ${t.id === selectedTopicId ? 'border-gold-500 bg-gold-500/10' : 'border-gold-500/30'} hover:border-gold-500/60 transition">
                                <div>
                                    <h4 class="font-bold text-sm ${t.id === selectedTopicId ? 'text-gold-400' : 'text-white'}">${t.title}</h4>
                                    <p class="text-[11px] text-slate-400">${t.subtitle || ''}</p>
                                </div>
                                ${topics.length > 1 ? `
                                    <button onclick="event.stopPropagation(); deleteConvTopic('${t.id}')" class="text-red-400 text-xs p-1"><i class="fa-solid fa-trash"></i></button>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>

                    <div class="glass-card p-5 rounded-2xl space-y-4">
                        <div class="flex justify-between items-center border-b border-gold-500/20 pb-3">
                            <div>
                                <h4 class="font-bold text-sm text-gold-400">${activeTopic ? activeTopic.title : 'ডায়ালগ'}</h4>
                                <p class="text-[11px] text-slate-400">${activeTopic ? (activeTopic.subtitle || '') : ''}</p>
                            </div>
                            <button onclick="openAddMessageModal('${selectedTopicId}')" class="px-3 py-1.5 rounded-xl bg-teal-600 text-white font-bold text-xs shadow hover:bg-teal-500">
                                + বার্তা যোগ করুন
                            </button>
                        </div>

                        <div class="space-y-3">
                            ${topicMessages.length === 0 ? `<p class="text-xs text-slate-400 italic">এই বিষয়ে কোনো বার্তা নেই। "+ বার্তা যোগ করুন" এ ক্লিক করে কথা যুক্ত করুন।</p>` : ''}
                            ${topicMessages.map(msg => `
                                <div class="p-3.5 rounded-xl bg-navy-900/70 border border-gold-500/10 space-y-1 relative">
                                    <div class="flex justify-between items-center">
                                        <span class="text-[10px] font-bold text-teal-400 uppercase tracking-wider">${msg.speaker}</span>
                                        <div class="flex items-center gap-3">
                                            <i class="fa-solid fa-volume-high text-xs text-gold-400 cursor-pointer hover:text-gold-300" onclick="speakText('${msg.en.replace(/'/g, "\\'")}')" title="উচ্চারণ শুনুন"></i>

                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function selectConvTopic(id) {
            selectedTopicId = id;
            renderConversationsView();
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
                showToast('অডিও প্লে হচ্ছে...');
            } else {
                showToast('আপনার ব্রাউজারে ভয়েস সাপোর্ট নেই');
            }
        }

            document.getElementById('general-modal-content').innerHTML = `
                <button onclick="toggleGeneralModal(false)" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
                <h3 class="text-lg font-bold gold-gradient-text mb-4">নতুন বিষয় যোগ করুন</h3>
                <div class="space-y-3">
                    <input id="new-topic-title" type="text" placeholder="বিষয়ের নাম (যেমন: রেস্তোরাঁ / Restaurant)" class="w-full p-3 rounded-xl bg-navy-900 border border-gold-500/20 text-xs text-white">
                    <input id="new-topic-sub" type="text" placeholder="উপশিরোনাম (যেমন: খাবার অর্ডার দেওয়া)" class="w-full p-3 rounded-xl bg-navy-900 border border-gold-500/20 text-xs text-white">
                    <button onclick="saveConvTopic()" class="w-full py-2.5 rounded-xl bg-gold-500 text-navy-900 font-bold text-xs uppercase shadow">বিষয় সংরক্ষণ</button>
                </div>
            `;
            toggleGeneralModal(true);
        }

        async function saveConvTopic() {
            const title = document.getElementById('new-topic-title').value.trim();
            const subtitle = document.getElementById('new-topic-sub').value.trim();
            if (!title) { showToast('বিষয়ের নাম দিন'); return; }
            const id = 'top_' + Date.now();
            await dbPut('conv_topics', { id, title, subtitle });
            selectedTopicId = id;
            toggleGeneralModal(false);
            showToast('নতুন বিষয় যুক্ত হয়েছে!');
            renderConversationsView();
        }

        async function deleteConvTopic(id) {
            await dbDelete('conv_topics', id);
            showToast('বিষয় মুছে ফেলা হয়েছে');
            renderConversationsView();
        }

        function openAddMessageModal(topicId) {
            document.getElementById('general-modal-content').innerHTML = `
                <button onclick="toggleGeneralModal(false)" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
                <h3 class="text-lg font-bold gold-gradient-text mb-4">কথোপকথন বার্তা যোগ করুন</h3>
                <div class="space-y-3">
                    <input id="new-msg-speaker" type="text" placeholder="বক্তা (যেমন: Buyer / Seller / Waiter)" class="w-full p-3 rounded-xl bg-navy-900 border border-gold-500/20 text-xs text-white">
                    <textarea id="new-msg-en" placeholder="ইংরেজি বাক্য (যেমন: May I have the menu?)" class="w-full p-3 rounded-xl bg-navy-900 border border-gold-500/20 text-xs text-white" rows="2"></textarea>
                    <textarea id="new-msg-bn" placeholder="বাংলা অর্থ (যেমন: আমি কি মেন্যুটি পেতে পারি?)" class="w-full p-3 rounded-xl bg-navy-900 border border-gold-500/20 text-xs text-white" rows="2"></textarea>
                    <button onclick="saveConvMessage('${topicId}')" class="w-full py-2.5 rounded-xl bg-teal-600 text-white font-bold text-xs uppercase shadow">বার্তা সংরক্ষণ করুন</button>
                </div>
            `;
            toggleGeneralModal(true);
        }

        async function saveConvMessage(topicId) {
            const speaker = document.getElementById('new-msg-speaker').value.trim() || 'Speaker';
            const en = document.getElementById('new-msg-en').value.trim();
            const bn = document.getElementById('new-msg-bn').value.trim();
            if (!en || !bn) { showToast('ইংরেজি ও বাংলা বাক্য লিখুন'); return; }
            const id = 'msg_' + Date.now();
            await dbPut('conv_messages', { id, topicId, speaker, en, bn });
            toggleGeneralModal(false);
            showToast('বার্তা সফলভাবে যোগ হয়েছে!');
            renderConversationsView();
        }

        async function deleteConvMessage(id) {
            await dbDelete('conv_messages', id);
            showToast('বার্তা মুছে ফেলা হয়েছে');
            renderConversationsView();
        }

        // --- TO-DO / ROUTINE MODULE ---
        async function renderTodoView() {
            const todos = await dbGetAll('todos');
            document.getElementById('app-content').innerHTML = `
                <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold gold-gradient-text"><i class="fa-solid fa-list-check"></i> কাজের তালিকা ও রুটিন</h2></div>
                <div class="glass-card p-4 rounded-2xl flex gap-2">
                    <input id="todo-input" type="text" placeholder="নতুন কাজ..." class="flex-1 p-3 rounded-xl bg-navy-900/60 border border-gold-500/20 text-xs focus:outline-none">
                    <button onclick="addTodo()" class="px-5 rounded-xl bg-gold-500 text-navy-900 font-bold text-xs">যোগ</button>
                </div>
                <div class="glass-card p-5 rounded-2xl space-y-2">
                    ${todos.map(t => `<div class="p-3 rounded-xl bg-navy-700/40 flex justify-between items-center text-xs"><label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" onchange="toggleTodo('${t.id}')" ${t.completed?'checked':''} class="accent-amber-500"><span class="${t.completed?'line-through text-slate-400':''}">${t.title}</span></label><button onclick="deleteTodo('${t.id}')" class="text-red-400"><i class="fa-solid fa-trash"></i></button></div>`).join('')}
                </div>
            `;
        }
        async function addTodo() {
            const title = document.getElementById('todo-input').value.trim();
            if(!title) return;
            await dbPut('todos', { id: Date.now().toString(), title, completed: false });
            renderTodoView();
        }
        async function toggleTodo(id) {
            const t = await dbGet('todos', id);
            if(t) { t.completed = !t.completed; await dbPut('todos', t); renderTodoView(); }
        }
        async function deleteTodo(id) { await dbDelete('todos', id); renderTodoView(); }

        // --- HABIT TRACKER ---
        async function renderHabitsView() {
            const habits = await dbGetAll('habits');
            document.getElementById('app-content').innerHTML = `
                <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold gold-gradient-text"><i class="fa-solid fa-chart-line"></i> অভ্যাস ট্র্যাকার</h2></div>
                <div class="glass-card p-4 rounded-2xl flex gap-2">
                    <input id="habit-title" type="text" placeholder="অভ্যাস..." class="flex-1 p-3 rounded-xl bg-navy-900/60 border border-gold-500/20 text-xs focus:outline-none">
                    <button onclick="addHabit()" class="px-5 rounded-xl bg-gold-500 text-navy-900 font-bold text-xs">তৈরি</button>
                </div>
                <div class="glass-card p-5 rounded-2xl space-y-2">
                    ${habits.map(h => `<div class="p-3 rounded-xl bg-navy-700/40 flex justify-between items-center text-xs"><span>${h.title} (স্ট্রীক: ${toBengaliNumerals(h.streak||0)} দিন)</span><div class="flex gap-2"><button onclick="incrementStreak('${h.id}')" class="px-2.5 py-1 bg-gold-500/20 text-gold-400 rounded-lg">সম্পন্ন</button><button onclick="deleteHabit('${h.id}')" class="text-red-400"><i class="fa-solid fa-trash"></i></button></div></div>`).join('')}
                </div>
            `;
        }
        async function addHabit() {
            const title = document.getElementById('habit-title').value.trim();
            if(!title) return;
            await dbPut('habits', { id: Date.now().toString(), title, streak: 0 });
            renderHabitsView();
        }
        async function incrementStreak(id) {
            const h = await dbGet('habits', id);
            if(h) { h.streak = (h.streak||0) + 1; await dbPut('habits', h); showToast('স্ট্রীক হালনাগাদ হয়েছে!'); renderHabitsView(); }
        }
        async function deleteHabit(id) { await dbDelete('habits', id); renderHabitsView(); }

        // --- HEALTH & FITNESS ---
        async function renderHealthView() {
            const today = getTodayDateStr();
            let health = (await dbGet('health', today)) || { water: 0, steps: 0, sleep: 0 };
            document.getElementById('app-content').innerHTML = `
                <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold gold-gradient-text"><i class="fa-solid fa-heart-pulse"></i> ফিটনেস ট্র্যাকার</h2></div>
                <div class="glass-card p-5 rounded-2xl space-y-4 text-xs">
                    <div class="flex justify-between font-bold text-slate-200"><span>পানি গ্রহণ</span><span class="text-blue-400">${toBengaliNumerals(health.water)} মি.লি.</span></div>
                    <div class="w-full bg-navy-900 h-3 rounded-full overflow-hidden border border-blue-500/20"><div class="bg-blue-500 h-full" style="width: ${Math.min(100, (health.water/2000)*100)}%"></div></div>
                    <div class="flex gap-2"><button onclick="addWater(250)" class="flex-1 py-2 bg-blue-500/20 text-blue-300 rounded-xl">+২৫০ মি.লি.</button><button onclick="addWater(500)" class="flex-1 py-2 bg-blue-500/20 text-blue-300 rounded-xl">+৫০০ মি.লি.</button><button onclick="resetWater()" class="px-3 bg-navy-700 text-slate-300 rounded-xl">রিসেট</button></div>
                </div>
            `;
        }
        async function addWater(amount) {
            const today = getTodayDateStr();
            let h = (await dbGet('health', today)) || { date: today, water: 0 };
            h.water = (h.water || 0) + amount;
            await dbPut('health', h);
            renderHealthView();
        }
        async function resetWater() {
            const today = getTodayDateStr();
            let h = (await dbGet('health', today)) || { date: today, water: 0 };
            h.water = 0;
            await dbPut('health', h);
            renderHealthView();
        }

        // --- DIARY MODULE ---
        async function renderDiaryView() {
            const entries = await dbGetAll('diary');
            document.getElementById('app-content').innerHTML = `
                <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold gold-gradient-text"><i class="fa-solid fa-book-bookmark"></i> ব্যক্তিগত ডায়েরি</h2></div>
                <div class="glass-card p-5 rounded-2xl space-y-3">
                    <input id="diary-title" type="text" placeholder="শিরোনাম..." class="w-full p-3 rounded-xl bg-navy-900/60 border border-gold-500/20 text-xs focus:outline-none">
                    <textarea id="diary-content" placeholder="অনুভূতি বা চিন্তাভাবনা..." class="w-full p-3 rounded-xl bg-navy-900/60 border border-gold-500/20 text-xs focus:outline-none" rows="3"></textarea>
                    <button onclick="saveDiary()" class="w-full py-2.5 rounded-xl bg-gold-500 text-navy-900 font-bold text-xs">সংরক্ষণ</button>
                </div>
                <div class="space-y-3">
                    ${entries.map(e => `<div class="glass-card p-4 rounded-xl text-xs space-y-1"><h4 class="font-bold text-gold-400">${e.title}</h4><p class="text-slate-300">${e.content}</p><div class="text-right"><button onclick="deleteDiary('${e.id}')" class="text-red-400 text-[10px]">মুছে ফেলুন</button></div></div>`).join('')}
                </div>
            `;
        }
        async function saveDiary() {
            const title = document.getElementById('diary-title').value.trim();
            const content = document.getElementById('diary-content').value.trim();
            if(!title || !content) return;
            await dbPut('diary', { id: Date.now().toString(), title, content, timestamp: new Date().toISOString() });
            renderDiaryView();
        }
        async function deleteDiary(id) { await dbDelete('diary', id); renderDiaryView(); }

        // --- SETTINGS & PROFILE MODULE ---
        async function renderSettingsView() {
            const profile = (await dbGet('settings', 'profile')) || { name: 'জ্ঞান অন্বেষণকারী', motto: 'নিরবচ্ছিন্ন আত্মউন্নয়ন ও বিকাশ' };
            document.getElementById('app-content').innerHTML = `
                <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold gold-gradient-text"><i class="fa-solid fa-sliders"></i> প্রোফাইল সেটিংস</h2></div>
                <div class="glass-card p-5 rounded-2xl space-y-3 text-xs">
                    <label class="text-slate-400">নাম</label>
                    <input id="set-name" type="text" value="${profile.name}" class="w-full p-2.5 rounded-xl bg-navy-900 border border-gold-500/20 text-white">
                    <label class="text-slate-400">নীতিবাক্য (Motto)</label>
                    <input id="set-motto" type="text" value="${profile.motto}" class="w-full p-2.5 rounded-xl bg-navy-900 border border-gold-500/20 text-white">
                    <button onclick="saveProfile()" class="py-2.5 px-4 bg-gold-500 text-navy-900 font-bold rounded-xl w-full">সংরক্ষণ করুন</button>
                </div>
            `;
        }
        async function saveProfile() {
            const name = document.getElementById('set-name').value;
            const motto = document.getElementById('set-motto').value;
            await dbPut('settings', { key: 'profile', name, motto });
            showToast('প্রোফাইল সংরক্ষিত হয়েছে');
        }

        // --- INIT ---
        window.addEventListener('DOMContentLoaded', async () => {
            loadThemePreference();
            await initDB();
            switchTab('dashboard');
        });
    </script>
</body>
</html>
