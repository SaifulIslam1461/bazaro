    <!-- APP CORE LOGIC & MODULES -->
    <script>
        const DB_NAME = 'HayatOSDB';
        const DB_VERSION = 1;
        let db = null;

        function initDB() {
            return new Promise((resolve, reject) => {
                if (db) return resolve(db);
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = (e) => reject("ডেটাবেস ত্রুটি: " + e.target.errorCode);
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('prayers')) db.createObjectStore('prayers', { keyPath: 'date' });
                    if (!db.objectStoreNames.contains('dhikr')) db.createObjectStore('dhikr', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('todos')) db.createObjectStore('todos', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('habits')) db.createObjectStore('habits', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('vocab')) db.createObjectStore('vocab', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('diary')) db.createObjectStore('diary', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('goals')) db.createObjectStore('goals', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('health')) db.createObjectStore('health', { keyPath: 'date' });
                    if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
                };
            });
        }

        function dbPut(storeName, data) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const req = store.put(data);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function dbGetAll(storeName) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readonly');
                const store = tx.objectStore(storeName);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function dbGet(storeName, key) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readonly');
                const store = tx.objectStore(storeName);
                const req = store.get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function dbDelete(storeName, key) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const req = store.delete(key);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        let currentTab = 'dashboard';
        const getTodayDateStr = () => new Date().toISOString().split('T')[0];

        function getBengaliFormattedDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return new Date().toLocaleDateString('bn-BD', options);
        }

        function toBengaliNumerals(num) {
            if (num === null || num === undefined) return '';
            const bengaliDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return num.toString().replace(/\d/g, (x) => bengaliDigits[x]);
        }

        function showToast(message, type = 'gold') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `p-3 rounded-xl shadow-xl text-xs font-semibold flex items-center gap-2 border transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto bg-navy-800 text-white border-gold-500/40`;
            toast.innerHTML = `<i class="fa-solid fa-circle-info text-gold-500"></i> <span>${message}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                icon.className = 'fa-solid fa-sun';
                localStorage.setItem('hayat_theme', 'light');
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                icon.className = 'fa-solid fa-moon';
                localStorage.setItem('hayat_theme', 'dark');
            }
        }

        function loadThemePreference() {
            const saved = localStorage.getItem('hayat_theme') || 'dark';
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (saved === 'light') {
                html.classList.remove('dark');
                html.classList.add('light');
                if(icon) icon.className = 'fa-solid fa-sun';
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                if(icon) icon.className = 'fa-solid fa-moon';
            }
        }

        function toggleQuickModal() {
            const modal = document.getElementById('quick-modal');
            modal.classList.toggle('hidden');
        }

        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const activeNav = document.getElementById(`nav-${tabId}`);
            if(activeNav) activeNav.classList.add('active');

            const content = document.getElementById('app-content');
            content.innerHTML = '';

            switch(tabId) {
                case 'dashboard': renderDashboardView(); break;
                case 'islamic': renderIslamicView(); break;
                case 'study': renderStudyView(); break;
                case 'todo': renderTodoView(); break;
                case 'habits': renderHabitsView(); break;
                case 'health': renderHealthView(); break;
                case 'diary': renderDiaryView(); break;
                case 'menu': renderMenuView(); break;
                case 'calendar': renderCalendarView(); break;
                case 'goals': renderGoalsView(); break;
                case 'reports': renderReportsView(); break;
                case 'backup': renderBackupView(); break;
                case 'settings': renderSettingsView(); break;
                default: renderDashboardView();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function renderDashboardView() {
            const today = getTodayDateStr();
            const prayerData = (await dbGet('prayers', today)) || { fajr: false, dhuhr: false, asr: false, maghrib: false, isha: false };
            const healthData = (await dbGet('health', today)) || { water: 0, steps: 0, sleep: 0 };
            const todos = await dbGetAll('todos');
            const pendingTodos = todos.filter(t => !t.completed).length;
            const habits = await dbGetAll('habits');

            const completedPrayersCount = Object.values(prayerData).filter(v => v === true).length;
            const prayerPercent = Math.round((completedPrayersCount / 5) * 100);
            const userProfile = (await dbGet('settings', 'profile')) || { name: 'জ্ঞান অন্বেষণকারী', motto: 'নিরবচ্ছিন্ন আত্মউন্নয়ন ও ঈমানী জীবন' };

            const app = document.getElementById('app-content');
            app.innerHTML = `
                <div class="glass-card rounded-2xl p-5 border-gold-500/30 relative overflow-hidden shadow-xl">
                    <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-gold-500/10 rounded-full blur-2xl"></div>
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="text-xs font-semibold text-gold-500 uppercase tracking-widest">আসসালামু আলাইকুম</span>
                            <h2 class="text-2xl font-bold text-slate-100 light:text-slate-800">${userProfile.name}</h2>
                        </div>
                        <span class="text-xs px-3 py-1 rounded-full bg-navy-700/60 light:bg-slate-200 text-gold-400 font-mono border border-gold-500/20">
                            ${getBengaliFormattedDate()}
                        </span>
                    </div>
                    <p class="text-xs text-slate-300 light:text-slate-600 italic">"${userProfile.motto}"</p>
                </div>

                <div class="p-4 rounded-xl bg-gradient-to-r from-navy-800 to-navy-700 light:from-slate-100 light:to-white border border-gold-500/20 shadow-md flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-gold-500/20 text-gold-500 flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-quote-left text-lg"></i>
                    </div>
                    <div>
                        <p class="text-xs font-medium text-slate-200 light:text-slate-700">"নিশ্চয়ই কষ্টের সাথেই রয়েছে স্বস্তি।"</p>
                        <span class="text-[10px] text-gold-500/80 font-mono">— সূরা আল-ইনশিরাহ (৯৪:৬)</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div onclick="switchTab('islamic')" class="glass-card p-4 rounded-2xl cursor-pointer hover:border-gold-500/50 transition">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs text-slate-400">নামাজ</span>
                            <i class="fa-solid fa-kaaba text-gold-500 text-sm"></i>
                        </div>
                        <div class="text-xl font-bold text-white light:text-slate-800">${toBengaliNumerals(completedPrayersCount)} <span class="text-xs font-normal text-slate-400">/ ৫</span></div>
                        <div class="w-full bg-navy-900/50 h-1.5 rounded-full mt-2 overflow-hidden">
                            <div class="bg-gold-500 h-full rounded-full transition-all duration-500" style="width: ${prayerPercent}%"></div>
                        </div>
                    </div>

                    <div onclick="switchTab('todo')" class="glass-card p-4 rounded-2xl cursor-pointer hover:border-gold-500/50 transition">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs text-slate-400">বাকি কাজ</span>
                            <i class="fa-solid fa-list-check text-gold-500 text-sm"></i>
                        </div>
                        <div class="text-xl font-bold text-white light:text-slate-800">${toBengaliNumerals(pendingTodos)} <span class="text-xs font-normal text-slate-400">টি</span></div>
                        <span class="text-[10px] text-gold-400 flex items-center gap-1 mt-2">
                            <i class="fa-solid fa-arrow-right text-[8px]"></i> রুটিন দেখুন
                        </span>
                    </div>

                    <div onclick="switchTab('health')" class="glass-card p-4 rounded-2xl cursor-pointer hover:border-gold-500/50 transition">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs text-slate-400">পানি গ্রহণ</span>
                            <i class="fa-solid fa-droplet text-blue-400 text-sm"></i>
                        </div>
                        <div class="text-xl font-bold text-white light:text-slate-800">${toBengaliNumerals(healthData.water || 0)} <span class="text-xs font-normal text-slate-400">মি.লি.</span></div>
                        <div class="w-full bg-navy-900/50 h-1.5 rounded-full mt-2 overflow-hidden">
                            <div class="bg-blue-400 h-full rounded-full transition-all duration-500" style="width: ${Math.min(100, ((healthData.water||0)/2000)*100)}%"></div>
                        </div>
                    </div>

                    <div onclick="switchTab('habits')" class="glass-card p-4 rounded-2xl cursor-pointer hover:border-gold-500/50 transition">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs text-slate-400">অভ্যাস</span>
                            <i class="fa-solid fa-fire text-amber-500 text-sm"></i>

        function rotateCard(cardEl) {
            let state = parseInt(cardEl.getAttribute('data-state') || '0');

            cardEl.setAttribute('data-state', state);

            const word = cardEl.querySelector('.d-word').innerText;
            const pronunciation = cardEl.querySelector('.d-pronunciation').innerText;
            const meaning = cardEl.querySelector('.d-meaning').innerText;
            const sentence = cardEl.querySelector('.d-sentence').innerText;
            
            const contentArea = cardEl.querySelector('.card-content-area');
            const stepLabel = cardEl.querySelector('.card-step-label');

            if (state === 0) {
                stepLabel.innerText = "১. মূল শব্দ";
                contentArea.innerHTML = `<h4 class="text-2xl font-bold text-white light:text-slate-800 tracking-wide">${word}</h4>`;
            } else if (state === 1) {
                stepLabel.innerText = "২. উচ্চারণ";
                contentArea.innerHTML = `
                    <div class="text-xs text-slate-400">উচ্চারণ:</div>
                    <div class="text-lg font-bold text-gold-400 mt-1">${pronunciation}</div>
                `;
            } else if (state === 2) {
                stepLabel.innerText = "৩. অর্থসমূহ";
                contentArea.innerHTML = `
                    <div class="text-xs text-slate-400">অর্থ:</div>
                    <div class="text-sm font-semibold text-slate-200 light:text-slate-800 mt-1 whitespace-pre-line">${meaning}</div>
                `;
            } else if (state === 3) {
                stepLabel.innerText = "৪. উদাহরণ বাক্য";
                contentArea.innerHTML = `
                    <div class="text-xs text-slate-400">উদাহরণ:</div>
                    <div class="text-xs text-gold-300 light:text-slate-700 italic mt-1 whitespace-pre-line">"${sentence}"</div>
                `;
            }
        }

        async function exportJSONBackup() {
            const stores = ['prayers', 'dhikr', 'todos', 'habits', 'vocab', 'diary', 'goals', 'health', 'settings'];
            const exportData = {};
            for (const store of stores) {
                exportData[store] = await dbGetAll(store);
            }
            const jsonStr = JSON.stringify(exportData, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `hayat_os_backup_${getTodayDateStr()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('ব্যাকআপ সফলভাবে ডাউনলোড হয়েছে!');
        }

        async function importJSONBackup() {
            const fileInput = document.getElementById('import-file');
            if(!fileInput.files.length) {
                showToast('অনুগ্রহ করে একটি JSON ফাইল নির্বাচন করুন');
                return;
            }
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    for (const storeName in data) {
                        if (db.objectStoreNames.contains(storeName)) {
                            for (const item of data[storeName]) {
                                await dbPut(storeName, item);
                            }
                        }
                    }
                    showToast('ডেটা সফলভাবে রিস্টোর করা হয়েছে!');
                    switchTab('dashboard');
                } catch (err) {
                    showToast('অকার্যকর JSON ফাইল ফরম্যাট');
                }
            };
            reader.readAsText(file);
        }

        function generatePDFReport() {
            if(!window.jspdf) {
                showToast('PDF মডিউল লোড হচ্ছে, অনুগ্রহ করে পুনরায় চেষ্টা করুন');

            }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(18);
            doc.text("HAYAT OS - Personal Life Management Report", 14, 20);
            doc.setFontSize(10);
            doc.text(`Generated on: ${new Date().toLocaleString('bn-BD')}`, 14, 28);

            showToast('PDF রিপোর্ট ডাউনলোড হয়েছে');
        }
