<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAZARO - এক বাজারে সবকিছু</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding-bottom: 60px; }
    header { background: #0d1b2a; color: white; padding: 15px; text-align: center; font-size: 24px; font-weight: bold; }
    .banner { background: #e07a5f; color: white; padding: 20px; text-align: center; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; padding: 15px; max-width: 800px; margin: auto; }
    .product-card { background: white; border-radius: 8px; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
    .product-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; }
    .product-card h3 { font-size: 16px; margin: 10px 0 5px; }
    .product-card p { font-size: 12px; color: #666; margin: 0 0 10px; }
    .price { color: #d90429; font-weight: bold; font-size: 16px; margin-bottom: 10px; }
    .buy-btn { background: #28a745; color: white; border: none; padding: 8px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; }
    #loading { text-align: center; padding: 20px; font-weight: bold; }
  </style>
</head>
<body>

<header>
  BAZARO
</header>

<div class="banner">
  <h2>সেরা মানের প্রিমিয়াম কালেকশন</h2>
  <p>অনলাইনে অর্ডার করুন, পেমেন্ট করুন ডেলিভারির সময়!</p>
</div>

<h3 style="padding-left: 15px; max-width: 800px; margin: 15px auto 0;">আমাদের পণ্যসমূহ</h3>

<div id="loading">প্রোডাক্ট লোড হচ্ছে...</div>
<div class="products-grid" id="product-container"></div>

<script>
  const SUPABASE_URL = "https://zwpoxufpeluqtdooeekr.supabase.co";
  const SUPABASE_KEY = "sb_publishable_TACq2hE6EHAx88w00X74XA_XQTMI1bW";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function loadProducts() {
    const container = document.getElementById('product-container');
    const loading = document.getElementById('loading');

    const { data: products, error } = await supabaseClient
      .from('products')
      .select('*')
      .order('id', { ascending: false });

    loading.style.display = 'none';

    if (error) {
      container.innerHTML = '<p style="color:red; text-align:center;">প্রোডাক্ট লোড করতে সমস্যা হয়েছে</p>';
      return;
    }

    if (!products || products.length === 0) {
      container.innerHTML = '<p style="text-align:center;">কোনো প্রোডাক্ট পাওয়া যায়নি</p>';
      return;
    }

    container.innerHTML = products.map(product => `
      <div class="product-card">
        <img src="${product.image_url || 'https://via.placeholder.com/150'}" alt="${product.name}">
        <h3>${product.name}</h3>
        <p>${product.description || ''}</p>
        <div class="price">৳ ${product.price}</div>
        <button class="buy-btn">কার্টে রাখুন</button>
      </div>
    `).join('');
  }

  loadProducts();
</script>

</body>
</html>
