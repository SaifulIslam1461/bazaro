<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAZARO - এক বাজারে সবকিছু</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff9800">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BAZARO">
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192/ff9800/ffffff?text=BAZARO">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f8f9fa; color: #333; padding-bottom: 70px; }

    header { background: #0b132b; color: #fff; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .logo-title { font-size: 22px; font-weight: bold; color: #f77f00; }
    .cart-btn-icon { position: relative; font-size: 20px; cursor: pointer; }
    .cart-count { position: absolute; top: -8px; right: -10px; background: #d62828; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; font-weight: bold; }

    /* Custom Install PWA Banner */
    #pwa-install-banner {
      display: none;
      background: #ff9800;
      color: white;
      padding: 10px 15px;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 55px;
      z-index: 99;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    #pwa-install-banner button {
      background: #0b132b;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
    }

    .hero-banner { background: linear-gradient(135deg, #f77f00, #fcbf49); color: #003049; text-align: center; padding: 18px 15px; }

    .cat-container { display: flex; gap: 8px; overflow-x: auto; padding: 12px 15px; background: white; border-bottom: 1px solid #eee; }
    .cat-chip { background: #f1f3f5; border: 1px solid #ddd; padding: 6px 14px; border-radius: 20px; font-size: 12px; white-space: nowrap; cursor: pointer; }

    .section-title { font-size: 16px; font-weight: bold; margin: 15px; border-left: 4px solid #f77f00; padding-left: 8px; }
    .products-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 15px; max-width: 900px; margin: auto; }
    
    .product-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #eee; position: relative; display: flex; flex-direction: column; cursor: pointer; }
    .product-card img { width: 100%; height: 160px; object-fit: cover; }
    .p-label { position: absolute; top: 8px; left: 8px; background: #d62828; color: white; padding: 2px 6px; border-radius: 3px; font-size: 9px; font-weight: bold; }
    .p-info { padding: 10px; flex-grow: 1; }
    .p-brand { font-size: 10px; color: #777; text-transform: uppercase; font-weight: bold; }
    .p-title { font-size: 13px; font-weight: bold; margin-top: 2px; height: 32px; overflow: hidden; }
    .p-price { color: #d62828; font-weight: bold; font-size: 14px; margin-top: 5px; }
    .old-price { color: #888; text-decoration: line-through; font-size: 11px; margin-left: 5px; }

    /* Modal / Details Popup */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; overflow-y: auto; }
    .modal-content { background: white; width: 95%; max-width: 600px; margin: 20px auto; padding: 20px; border-radius: 8px; position: relative; }
    .close-btn { position: absolute; right: 15px; top: 15px; font-size: 22px; cursor: pointer; font-weight: bold; }

    .gallery-main { width: 100%; height: 260px; object-fit: cover; border-radius: 6px; }
    .gallery-thumbs { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; }
    .gallery-thumbs img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd; cursor: pointer; }

    .opt-title { font-size: 12px; font-weight: bold; margin-top: 12px; }
    .opt-box { display: flex; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
    .opt-btn { border: 1px solid #ccc; padding: 6px 12px; font-size: 12px; border-radius: 4px; cursor: pointer; background: white; }
    .opt-btn.selected { border-color: #f77f00; background: #fff3e6; color: #f77f00; font-weight: bold; }

    .btn-group { display: flex; gap: 8px; margin-top: 15px; }
    .btn-cart { background: #003049; color: white; border: none; padding: 12px; border-radius: 4px; flex: 1; font-weight: bold; cursor: pointer; font-size: 13px; }
    .btn-buy { background: #f77f00; color: white; border: none; padding: 12px; border-radius: 4px; flex: 1; font-weight: bold; cursor: pointer; font-size: 13px; }
    .btn-wa { background: #25d366; color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; text-decoration: none; text-align: center; }

    input, select, textarea { width: 100%; padding: 10px; margin-top: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    .checkout-btn { background: #28a745; color: white; font-weight: bold; border: none; padding: 12px; width: 100%; border-radius: 4px; margin-top: 15px; cursor: pointer; }

    .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #eee; }
    .nav-item { text-align: center; color: #666; text-decoration: none; font-size: 11px; }
    .nav-item i { font-size: 18px; display: block; }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="logo-title">BAZARO</div>
      <div style="font-size: 10px; color: #a3b18a;">এক বাজারে সবকিছু</div>
    </div>
    <div class="cart-btn-icon" onclick="openCart()">
      <i class="fas fa-shopping-cart"></i>
      <span class="cart-count" id="cart-count">0</span>
    </div>
  </header>

  <!-- PWA Install App Banner -->
  <div id="pwa-install-banner">
    <div style="font-size: 13px; font-weight: bold;"><i class="fas fa-mobile-alt"></i> BAZARO অ্যাপ ইনস্টল করুন</div>
    <button id="btn-install-app">ইনস্টল করুন</button>
  </div>

  <div class="hero-banner">
    <h2>প্রিমিয়াম কোয়ালিটির অফিশিয়াল কালেকশন</h2>
    <p>ক্যাশ অন ডেলিভারিতে সারাদেশে ডেলিভারি!</p>
  </div>

  <div class="cat-container" id="category-list"></div>

  <div class="section-title">আমাদের সমস্ত প্রোডাক্ট</div>
  <div class="products-container" id="product-container">
    <p style="text-align:center; grid-column: span 2;">লোড হচ্ছে...</p>
  </div>

  <!-- PRODUCT DETAILS MODAL -->
  <div class="modal" id="details-modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeDetails()">&times;</span>
      <div id="details-body"></div>
    </div>
  </div>

  <!-- CART MODAL -->
  <div class="modal" id="cart-modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeCart()">&times;</span>
      <h3>আপনার শপিং কার্ট</h3>
      <div id="cart-items" style="margin-top: 15px;"></div>
      <hr style="margin: 15px 0;">
      <div style="display:flex; justify-content:space-between; font-weight:bold;">
        <span>মোট মূল্য:</span>
        <span id="cart-total">৳ 0</span>
      </div>
      <button class="checkout-btn" onclick="openCheckout()">অর্ডার কনফার্ম করুন</button>
    </div>
  </div>

  <!-- CHECKOUT MODAL -->
  <div class="modal" id="checkout-modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeCheckout()">&times;</span>
      <h3>শিপিং ও অর্ডার ফর্ম</h3>
      <form id="order-form" onsubmit="submitOrder(event)">
        <input type="text" id="cust_name" placeholder="আপনার পুরো নাম" required>
        <input type="tel" id="cust_phone" placeholder="মোবাইল নম্বর" required>
        <input type="text" id="cust_district" placeholder="জেলা" required>
        <input type="text" id="cust_upazila" placeholder="উপজেলা" required>
        <textarea id="cust_address" placeholder="বিস্তারিত ঠিকানা" required rows="2"></textarea>
        
        <label style="display:block; margin-top:10px; font-weight:bold; font-size:12px;">পেমেন্ট মেথড:</label>
        <select id="payment_method">
          <option value="COD">ক্যাশ অন ডেলিভারি (Cash on Delivery)</option>
          <option value="bKash">বিকাশ (bKash)</option>
        </select>

        <button type="submit" class="checkout-btn">অর্ডার সম্পন্ন করুন</button>
      </form>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="#" class="nav-item"><i class="fas fa-home"></i> হোম</a>
    <a href="javascript:openCart()" class="nav-item"><i class="fas fa-shopping-bag"></i> কার্ট</a>
  </div>

<script>
  const SUPABASE_URL = "https://zwpoxufpeluqtdooeekr.supabase.co";
  const SUPABASE_KEY = "sb_publishable_TACq2hE6EHAx88w00X74XA_XQTMI1bW";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let cart = JSON.parse(localStorage.getItem('bazaro_cart')) || [];
  let currentProduct = null;
  let selectedSize = '';
  let selectedColor = '';

  // PWA Service Worker Registration
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js')
        .then(reg => console.log('PWA Service Worker Registered!'))
        .catch(err => console.log('Service Worker Failed:', err));
    });
  }

  // PWA Add to Home Screen / Install Banner Prompt
  let deferredPrompt;
  const installBanner = document.getElementById('pwa-install-banner');
  const installBtn = document.getElementById('btn-install-app');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBanner.style.display = 'flex';
  });

  installBtn.addEventListener('click', () => {
    installBanner.style.display = 'none';
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          console.log('User accepted the PWA install prompt');
        }
        deferredPrompt = null;
      });
    }
  });

  function updateCartUI() {
    document.getElementById('cart-count').innerText = cart.reduce((sum, item) => sum + item.qty, 0);
    localStorage.setItem('bazaro_cart', JSON.stringify(cart));
  }

  async function loadData() {
    const { data: categories } = await supabaseClient.from('categories').select('*');
    if (categories) {
      document.getElementById('category-list').innerHTML = `<div class="cat-chip" onclick="filterCat('all')">সবগুলো</div>` + categories.map(c => 
        `<div class="cat-chip" onclick="filterCat('${c.name}')">${c.name}</div>`
      ).join('');
    }
    loadProducts('all');
  }

  async function loadProducts(cat) {
    let query = supabaseClient.from('products').select('*').order('id', {ascending: false});
    if(cat !== 'all') query = query.eq('category', cat);
    
    const { data: products } = await query;
    const container = document.getElementById('product-container');
    
    if (products && products.length > 0) {
      container.innerHTML = products.map(p => `
        <div class="product-card" onclick="openDetails(${p.id})">
          ${p.product_label ? `<div class="p-label">${p.product_label}</div>` : ''}
          <img src="${p.image_url || 'https://via.placeholder.com/150'}" alt="${p.name}">
          <div class="p-info">
            <div class="p-brand">${p.brand || 'BAZARO'}</div>
            <div class="p-title">${p.name}</div>
            <div class="p-price">৳ ${p.discount_price || p.price} ${p.discount_price ? `<span class="old-price">৳${p.price}</span>` : ''}</div>
          </div>
        </div>
      `).join('');
    } else {
      container.innerHTML = '<p style="grid-column: span 2; text-align:center;">কোনো প্রোডাক্ট পাওয়া যায়নি</p>';
    }
  }

  function filterCat(catName) { loadProducts(catName); }

  async function openDetails(id) {
    const { data: p } = await supabaseClient.from('products').select('*').eq('id', id).single();
    if(!p) return;

    currentProduct = p;
    selectedSize = (p.sizes && p.sizes.length > 0) ? p.sizes[0] : '';
    selectedColor = (p.colors && p.colors.length > 0) ? p.colors[0] : '';

    const { data: reviews } = await supabaseClient.from('reviews').select('*').eq('product_id', p.id);
    const avgRating = reviews && reviews.length > 0 ? (reviews.reduce((a,b)=>a+b.rating,0)/reviews.length).toFixed(1) : '5.0';

    const images = [p.image_url, p.gallery_1, p.gallery_2, p.gallery_3, p.gallery_4].filter(Boolean);

    document.getElementById('details-body').innerHTML = `
      <img id="main-gallery" class="gallery-main" src="${images[0]}">
      <div class="gallery-thumbs">
        ${images.map(img => `<img src="${img}" onclick="document.getElementById('main-gallery').src='${img}'">`).join('')}
      </div>

      <div style="font-size:11px; color:#777; margin-top:10px; font-weight:bold;">${p.brand || 'BAZARO'} | ${p.stock_status || 'In Stock'}</div>
      <h2 style="font-size:18px; margin-top:2px;">${p.name}</h2>
      
      <div style="color:#f77f00; font-size:12px; margin-top:4px;">
        <i class="fas fa-star"></i> ${avgRating} (${reviews ? reviews.length : 0} রিভিউ)
      </div>

      <div class="p-price" style="font-size:20px; margin-top:8px;">
        ৳ ${p.discount_price || p.price} 
        ${p.discount_price ? `<span class="old-price" style="font-size:14px;">৳${p.price}</span>` : ''}
      </div>

      ${p.sizes && p.sizes.length > 0 ? `
        <div class="opt-title">সাইজ সিলেক্ট করুন:</div>
        <div class="opt-box">
          ${p.sizes.map(s => `<button class="opt-btn ${s===selectedSize?'selected':''}" onclick="selectOpt('size','${s}',this)">${s}</button>`).join('')}
        </div>
      ` : ''}

      ${p.colors && p.colors.length > 0 ? `
        <div class="opt-title">কালার সিলেক্ট করুন:</div>
        <div class="opt-box">
          ${p.colors.map(c => `<button class="opt-btn ${c===selectedColor?'selected':''}" onclick="selectOpt('color','${c}',this)">${c}</button>`).join('')}
        </div>
      ` : ''}

      <div class="btn-group">
        <button class="btn-cart" onclick="addToCartCurrent()">কার্টে রাখুন</button>
        <button class="btn-buy" onclick="buyNowCurrent()">এখনই কিনুন</button>
        <a class="btn-wa" href="https://wa.me/8801603146149?text=I%20want%20to%20buy%20${encodeURIComponent(p.name)}" target="_blank"><i class="fab fa-whatsapp"></i></a>
      </div>

      <div style="margin-top:20px; border-top:1px solid #eee; padding-top:10px;">
        <h4>প্রোডাক্ট স্পেসিফিকেশন:</h4>
        <ul style="font-size:12px; margin-left:20px; margin-top:5px; color:#555;">
          ${p.material ? `<li>ম্যাটেরিয়াল: ${p.material}</li>` : ''}
          ${p.weight ? `<li>ওজন: ${p.weight}</li>` : ''}
          ${p.origin_country ? `<li>উৎপাদন: ${p.origin_country}</li>` : ''}
          ${p.warranty ? `<li>ওয়ারেন্টি: ${p.warranty}</li>` : ''}
          ${p.gender ? `<li>জেন্ডার: ${p.gender}</li>` : ''}
        </ul>
      </div>

      <div style="margin-top:15px; border-top:1px solid #eee; padding-top:10px;">
        <h4>বিস্তারিত বিবরণ:</h4>
        <p style="font-size:13px; color:#444; margin-top:5px; line-height:1.5;">${p.description || p.short_description || 'কোনো বিবরণ দেওয়া নেই।'}</p>
      </div>

      <div style="margin-top:20px; border-top:1px solid #eee; padding-top:10px;">
        <h4>গ্রাহকদের রিভিউ (${reviews ? reviews.length : 0})</h4>
        <div style="margin-top:10px;">
          ${reviews && reviews.length > 0 ? reviews.map(r => `
            <div style="background:#f9f9f9; padding:8px; border-radius:4px; margin-bottom:6px; font-size:12px;">
              <b>${r.customer_name}</b> - ⭐${r.rating}/5
              <p style="color:#555; margin-top:2px;">${r.comment}</p>
            </div>
          `).join('') : '<p style="font-size:12px; color:#777;">এখনও কোনো রিভিউ নেই।</p>'}
        </div>

        <form onsubmit="submitReview(event, ${p.id})" style="margin-top:10px;">
          <input type="text" id="rev_name" placeholder="আপনার নাম" required>
          <select id="rev_rating">
            <option value="5">⭐⭐⭐⭐⭐ (5 Star)</option>
            <option value="4">⭐⭐⭐⭐ (4 Star)</option>
            <option value="3">⭐⭐⭐ (3 Star)</option>
          </select>
          <textarea id="rev_comment" placeholder="রিভিউ লিখুন..." rows="2" required></textarea>
          <button type="submit" style="background:#003049; color:white; border:none; padding:8px; font-size:12px; border-radius:4px; margin-top:5px; cursor:pointer;">রিভিউ জমা দিন</button>
        </form>
      </div>
    `;

    document.getElementById('details-modal').style.display = 'block';
  }

  function selectOpt(type, val, btn) {
    if(type === 'size') selectedSize = val;
    if(type === 'color') selectedColor = val;
    btn.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  }

  function closeDetails() { document.getElementById('details-modal').style.display = 'none'; }

  function addToCartCurrent() {
    if(!currentProduct) return;
    const price = currentProduct.discount_price || currentProduct.price;
    const item = {
      id: currentProduct.id,
      name: currentProduct.name + (selectedSize ? ` (${selectedSize})` : '') + (selectedColor ? ` [${selectedColor}]` : ''),
      price: price,
      qty: 1
    };
    cart.push(item);
    updateCartUI();
    alert('কার্টে যোগ করা হয়েছে!');
  }

  function buyNowCurrent() {
    addToCartCurrent();
    closeDetails();
    openCheckout();
  }

  async function submitReview(e, productId) {
    e.preventDefault();
    const customer_name = document.getElementById('rev_name').value;
    const rating = parseInt(document.getElementById('rev_rating').value);
    const comment = document.getElementById('rev_comment').value;

    await supabaseClient.from('reviews').insert([{ product_id: productId, customer_name, rating, comment }]);
    alert('ধন্যবাদ! আপনার রিভিউ জমা হয়েছে।');
    openDetails(productId);
  }

  function openCart() {
    const cartItems = document.getElementById('cart-items');
    let total = 0;
    cartItems.innerHTML = cart.length === 0 ? '<p>কার্ট খালি আছে!</p>' : cart.map((item) => {
      total += item.price * item.qty;
      return `<div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:13px;">
        <div>${item.name} (x${item.qty})</div>
        <div>৳ ${item.price * item.qty}</div>
      </div>`;
    }).join('');
    document.getElementById('cart-total').innerText = '৳ ' + total;
    document.getElementById('cart-modal').style.display = 'block';
  }

  function closeCart() { document.getElementById('cart-modal').style.display = 'none'; }
  function openCheckout() { 
    if(cart.length === 0) { alert('কার্ট খালি!'); return; }
    closeCart(); 
    document.getElementById('checkout-modal').style.display = 'block'; 
  }
  function closeCheckout() { document.getElementById('checkout-modal').style.display = 'none'; }

  async function submitOrder(e) {
    e.preventDefault();
    const total_amount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
    
    const { error } = await supabaseClient.from('orders').insert([{
      customer_name: document.getElementById('cust_name').value,
      phone: document.getElementById('cust_phone').value,
      district: document.getElementById('cust_district').value,
      upazila: document.getElementById('cust_upazila').value,
      address: document.getElementById('cust_address').value,
      payment_method: document.getElementById('payment_method').value,
      total_amount: total_amount,
      status: 'Pending'
    }]);

    if (error) {
      alert('অর্ডার সাবমিট করতে সমস্যা হয়েছে: ' + error.message);
    } else {
      alert('🎉 আপনার অর্ডারটি সফলভাবে সম্পন্ন হয়েছে!');
      cart = [];
      updateCartUI();
      closeCheckout();
    }
  }

  updateCartUI();
  loadData();
</script>
</body>
</html>
