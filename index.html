    <!-- APP CORE LOGIC -->
    <script>
        const DB_NAME = 'HayatOSDB';
        const DB_VERSION = 1;
        let db = null;

        function initDB() {
            return new Promise((resolve, reject) => {
                if (db) return resolve(db);
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = (e) => reject("ডেটাবেস ত্রুটি: " + e.target.errorCode);
                request.onsuccess = (e) => { db = e.target.result; resolve(db); };
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('prayers')) db.createObjectStore('prayers', { keyPath: 'date' });
                    if (!db.objectStoreNames.contains('dhikr')) db.createObjectStore('dhikr', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('todos')) db.createObjectStore('todos', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('habits')) db.createObjectStore('habits', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('vocab')) db.createObjectStore('vocab', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('diary')) db.createObjectStore('diary', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('goals')) db.createObjectStore('goals', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('health')) db.createObjectStore('health', { keyPath: 'date' });
                    if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
                    if (!db.objectStoreNames.contains('conversations')) db.createObjectStore('conversations', { keyPath: 'id' });
                };
            });
        }

        function dbPut(storeName, data) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const req = store.put(data);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function dbGetAll(storeName) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readonly');
                const store = tx.objectStore(storeName);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function dbGet(storeName, key) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readonly');
                const store = tx.objectStore(storeName);
                const req = store.get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function dbDelete(storeName, key) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const req = store.delete(key);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        let currentTab = 'dashboard';
        const getTodayDateStr = () => new Date().toISOString().split('T')[0];

        function getBengaliFormattedDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return new Date().toLocaleDateString('bn-BD', options);
        }

        function toBengaliNumerals(num) {
            if (num === null || num === undefined) return '';
            const bengaliDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return num.toString().replace(/\d/g, (x) => bengaliDigits[x]);
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `p-3 rounded-xl shadow-xl text-xs font-semibold flex items-center gap-2 border transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto bg-navy-800 text-white border-gold-500/40`;
            toast.innerHTML = `<i class="fa-solid fa-circle-info text-gold-500"></i> <span>${message}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                icon.className = 'fa-solid fa-sun';
                localStorage.setItem('hayat_theme', 'light');
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                icon.className = 'fa-solid fa-moon';
                localStorage.setItem('hayat_theme', 'dark');
            }
        }

        function loadThemePreference() {
            const saved = localStorage.getItem('hayat_theme') || 'dark';
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (saved === 'light') {
                html.classList.remove('dark');
                html.classList.add('light');
                if(icon) icon.className = 'fa-solid fa-sun';
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                if(icon) icon.className = 'fa-solid fa-moon';
            }
        }

        function toggleQuickModal() {
            document.getElementById('quick-modal').classList.toggle('hidden');
        }

        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const activeNav = document.getElementById(`nav-${tabId}`);
            if(activeNav) activeNav.classList.add('active');

            const content = document.getElementById('app-content');
            content.innerHTML = '';

            switch(tabId) {
                case 'dashboard': renderDashboardView(); break;
                case 'islamic': renderIslamicView(); break;
                case 'study': renderStudyView(); break;
                case 'todo': renderTodoView(); break;
                case 'habits': renderHabitsView(); break;
                case 'health': renderHealthView(); break;
                case 'diary': renderDiaryView(); break;
                case 'menu': renderMenuView(); break;
                case 'calendar': renderCalendarView(); break;
                case 'goals': renderGoalsView(); break;
                case 'reports': renderReportsView(); break;
                case 'backup': renderBackupView(); break;
                case 'settings': renderSettingsView(); break;
                case 'sub_vocab_quiz': renderVocabQuizView(0); break;
                case 'sub_conversations': renderConversationsView(); break;
                default: renderDashboardView();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- DASHBOARD ---

                </div>

                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div onclick="switchTab('islamic')" class="glass-card p-4 rounded-2xl cursor-pointer hover:border-gold-500/50 transition">
                        <span class="text-xs text-slate-400">নামাজ</span>
                        <div class="text-xl font-bold text-white light:text-slate-800 mt-1">${toBengaliNumerals(completedPrayersCount)} / ৫</div>
                    </div>
                    <div onclick="switchTab('todo')" class="glass-card p-4 rounded-2xl cursor-pointer hover:border-gold-500/50 transition">

                    </div>
                    <div onclick="switchTab('health')" class="glass-card p-4 rounded-2xl cursor-pointer hover:border-gold-500/50 transition">
                        <span class="text-xs text-slate-400">পানি গ্রহণ</span>
                        <div class="text-xl font-bold text-white light:text-slate-800 mt-1">${toBengaliNumerals(healthData.water || 0)} মি.লি.</div>

                    <div onclick="switchTab('habits')" class="glass-card p-4 rounded-2xl cursor-pointer hover:border-gold-500/50 transition">
                        <span class="text-xs text-slate-400">অভ্যাস</span>

        function rotateCard(cardEl) {
            let state = parseInt(cardEl.getAttribute('data-state') || '0');
            state = (state + 1) % 4; 
            cardEl.setAttribute('data-state', state);

            const word = cardEl.querySelector('.d-word').innerText;
            const pronunciation = cardEl.querySelector('.d-pronunciation').innerText;
            const meaning = cardEl.querySelector('.d-meaning').innerText;
            const sentenceHTML = cardEl.querySelector('.d-sentence').innerHTML;
            
            const contentArea = cardEl.querySelector('.card-content-area');
            const stepLabel = cardEl.querySelector('.card-step-label');

            if (state === 0) {
                stepLabel.innerText = "১. মূল শব্দ";
                contentArea.innerHTML = `<h4 class="text-2xl font-bold text-white light:text-slate-800 tracking-wide">${word}</h4>`;
            } else if (state === 1) {
                stepLabel.innerText = "২. উচ্চারণ";
                contentArea.innerHTML = `
                    <div class="text-xs text-slate-400">উচ্চারণ:</div>
                    <div class="text-lg font-bold text-gold-400 mt-1">${pronunciation}</div>
                `;
            } else if (state === 2) {
                stepLabel.innerText = "৩. অর্থসমূহ";
                contentArea.innerHTML = `
                    <div class="text-xs text-slate-400">অর্থ:</div>
                    <div class="text-sm font-semibold text-slate-200 light:text-slate-800 mt-1 whitespace-pre-line">${meaning}</div>
                `;
            } else if (state === 3) {
                stepLabel.innerText = "৪. উদাহরণ বাক্য";
                contentArea.innerHTML = `
                    <div class="text-xs text-slate-400 mb-1">উদাহরণসমূহ:</div>
                    <div class="text-xs text-left max-h-24 overflow-y-auto px-2">${sentenceHTML}</div>
                `;
            }
        }

        async function saveVocab() {
            const idInput = document.getElementById('vocab-id').value;
            const word = document.getElementById('vocab-word').value.trim();
            const pronunciation = document.getElementById('vocab-pronunciation').value.trim();
            const meaning = document.getElementById('vocab-meaning').value.trim();
            const sentence = document.getElementById('vocab-sentence').value.trim();

            if (!word || !meaning) {
                showToast('অনুগ্রহ করে শব্দ এবং অর্থ প্রদান করুন');
                return;
            }

            const id = idInput ? idInput : Date.now().toString();
            const vocabObj = { id, word, pronunciation, meaning, sentence };
            
            await dbPut('vocab', vocabObj);
            showToast(idInput ? 'শব্দ হালনাগাদ করা হয়েছে!' : 'নতুন শব্দ সংরক্ষিত হয়েছে!');
            resetVocabForm();
            renderStudyView();
        }

        function editVocab(id, word, pronunciation, meaning, sentence) {
            document.getElementById('vocab-id').value = id;
            document.getElementById('vocab-word').value = decodeURIComponent(word);
            document.getElementById('vocab-pronunciation').value = decodeURIComponent(pronunciation);
            document.getElementById('vocab-meaning').value = decodeURIComponent(meaning);
            document.getElementById('vocab-sentence').value = decodeURIComponent(sentence);
            
            document.getElementById('vocab-save-btn').innerText = 'হালনাগাদ করুন';
            document.getElementById('vocab-cancel-btn').classList.remove('hidden');
            window.scrollTo({ top: 100, behavior: 'smooth' });
        }

        function resetVocabForm() {
            document.getElementById('vocab-id').value = '';
            document.getElementById('vocab-word').value = '';
            document.getElementById('vocab-pronunciation').value = '';
            document.getElementById('vocab-meaning').value = '';
            document.getElementById('vocab-sentence').value = '';
            document.getElementById('vocab-save-btn').innerText = 'শব্দ সংরক্ষণ করুন';
            document.getElementById('vocab-cancel-btn').classList.add('hidden');

        function openAddMessageModal(convId) {
            activeConvAction = 'message';
            activeConvId = convId;
            document.getElementById('conv-modal-title').innerText = 'নতুন বার্তা যোগ করুন';
            document.getElementById('conv-modal-body').innerHTML = `
                <select id="modal-msg-speaker" class="w-full p-3 rounded-xl bg-navy-900 border border-gold-500/20 text-xs text-white focus:outline-none">
                    <option value="Buyer">Buyer (ক্রেতা/জিজ্ঞাসাকারী)</option>
                    <option value="Seller">Seller (বিক্রেতা/উত্তরদাতা)</option>
                </select>
                <input id="modal-msg-en" type="text" placeholder="ইংরেজি বাক্য (English sentence)..." class="w-full p-3 rounded-xl bg-navy-900 border border-gold-500/20 text-xs text-white focus:outline-none">
                <input id="modal-msg-bn" type="text" placeholder="বাংলা অর্থ..." class="w-full p-3 rounded-xl bg-navy-900 border border-gold-500/20 text-xs text-white focus:outline-none">
            `;
            document.getElementById('conv-modal').classList.remove('hidden');
        }

        async function submitConvModal() {
            if (activeConvAction === 'topic') {
                const title = document.getElementById('modal-topic-title').value.trim();
                const subtitle = document.getElementById('modal-topic-sub').value.trim();
                if (!title) return showToast('বিষয়ের নাম দিন');
                const newTopic = { id: Date.now().toString(), title, subtitle, messages: [] };
                await dbPut('conversations', newTopic);
                showToast('নতুন বিষয় সফলভাবে যোগ হয়েছে!');
            } else if (activeConvAction === 'message') {
                const speaker = document.getElementById('modal-msg-speaker').value;
                const en = document.getElementById('modal-msg-en').value.trim();
                const bn = document.getElementById('modal-msg-bn').value.trim();
                if (!en || !bn) return showToast('ইংরেজি ও বাংলা বাক্য দিন');
                
                const conv = await dbGet('conversations', activeConvId);
                if (conv) {
                    conv.messages.push({ speaker, en, bn });
                    await dbPut('conversations', conv);
                    showToast('বার্তা যুক্ত করা হয়েছে!');
                }
            }
            document.getElementById('conv-modal').classList.add('hidden');
            renderConversationsView();
        }

        async function deleteConversation(id) {
            await dbDelete('conversations', id);
            showToast('মুছে ফেলা হয়েছে');
            renderConversationsView();
        }

        // --- OTHER CORE MODULES ---
        async function renderIslamicView() {
            const today = getTodayDateStr();
            let prayerData = (await dbGet('prayers', today)) || { date: today, fajr: false, dhuhr: false, asr: false, maghrib: false, isha: false };
            document.getElementById('app-content').innerHTML = `
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-bold gold-gradient-text flex items-center gap-2"><i class="fa-solid fa-kaaba"></i> সালাত ট্র্যাকার</h2>
                </div>
                <div class="glass-card p-5 rounded-2xl space-y-3">
                    ${['fajr', 'dhuhr', 'asr', 'maghrib', 'isha'].map(p => `
                        <label class="flex items-center justify-between p-3 rounded-xl bg-navy-700/40 border border-gold-500/10 cursor-pointer">
                            <span class="capitalize font-semibold text-sm">${p}</span>
                            <input type="checkbox" onchange="togglePrayer('${p}')" ${prayerData[p] ? 'checked' : ''} class="w-5 h-5 accent-amber-500 rounded">
                        </label>
                    `).join('')}
                </div>
            `;
        }
        async function togglePrayer(p) {
            const today = getTodayDateStr();
            let data = (await dbGet('prayers', today)) || { date: today };
            data[p] = !data[p];
            await dbPut('prayers', data);
            showToast('নামাজের স্ট্যাটাস হালনাগাদ হয়েছে');
            renderIslamicView();
        }

        async function renderTodoView() {
            const todos = await dbGetAll('todos');
            document.getElementById('app-content').innerHTML = `
                <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold gold-gradient-text"><i class="fa-solid fa-list-check"></i> কাজের তালিকা</h2></div>
                <div class="glass-card p-4 rounded-2xl flex gap-2">
                    <input id="todo-input" type="text" placeholder="নতুন কাজ..." class="flex-1 p-3 rounded-xl bg-navy-900/60 border border-gold-500/20 text-xs focus:outline-none">
                    <button onclick="addTodo()" class="px-5 rounded-xl bg-gold-500 text-navy-900 font-bold text-xs">যোগ</button>
                </div>
                <div class="glass-card p-5 rounded-2xl space-y-2">
                    ${todos.map(t => `<div class="p-3 rounded-xl bg-navy-700/40 flex justify-between items-center text-xs"><span class="${t.completed?'line-through text-slate-400':''}">${t.title}</span><button onclick="deleteTodo('${t.id}')" class="text-red-400"><i class="fa-solid fa-trash"></i></button></div>`).join('')}
                </div>
            `;
        }
        async function addTodo() {
            const title = document.getElementById('todo-input').value.trim();
            if(!title) return;
            await dbPut('todos', { id: Date.now().toString(), title, completed: false });
            renderTodoView();
        }
        async function deleteTodo(id) { await dbDelete('todos', id); renderTodoView(); }

        async function renderHabitsView() {
            const habits = await dbGetAll('habits');
            document.getElementById('app-content').innerHTML = `
                <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold gold-gradient-text"><i class="fa-solid fa-chart-line"></i> অভ্যাস ট্র্যাকার</h2></div>
                <div class="glass-card p-4 rounded-2xl flex gap-2">
                    <input id="habit-title" type="text" placeholder="অভ্যাস..." class="flex-1 p-3 rounded-xl bg-navy-900/60 border border-gold-500/20 text-xs focus:outline-none">
                    <button onclick="addHabit()" class="px-5 rounded-xl bg-gold-500 text-navy-900 font-bold text-xs">তৈরি</button>
                </div>
                <div class="glass-card p-5 rounded-2xl space-y-2">
                    ${habits.map(h => `<div class="p-3 rounded-xl bg-navy-700/40 flex justify-between items-center text-xs"><span>${h.title} (স্ট্রীক: ${h.streak||0})</span><button onclick="deleteHabit('${h.id}')" class="text-red-400"><i class="fa-solid fa-trash"></i></button></div>`).join('')}
                </div>
            `;
        }
        async function addHabit() {
            const title = document.getElementById('habit-title').value.trim();
            if(!title) return;
            await dbPut('habits', { id: Date.now().toString(), title, streak: 0 });
            renderHabitsView();
        }
        async function deleteHabit(id) { await dbDelete('habits', id); renderHabitsView(); }

        async function renderHealthView() {
            const today = getTodayDateStr();
            let health = (await dbGet('health', today)) || { water: 0, steps: 0, sleep: 0 };
            document.getElementById('app-content').innerHTML = `
                <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold gold-gradient-text"><i class="fa-solid fa-heart-pulse"></i> ফিটনেস</h2></div>
                <div class="glass-card p-5 rounded-2xl space-y-4 text-xs">
                    <div>পানি: ${health.water} মি.লি.</div>
                    <button onclick="addWater()" class="py-2 px-4 bg-blue-500 text-white rounded-xl">+২৫০ মি.লি. পানি</button>
                </div>
            `;
        }
        async function addWater() {
            const today = getTodayDateStr();
            let h = (await dbGet('health', today)) || { date: today, water: 0 };
            h.water = (h.water || 0) + 250;
            await dbPut('health', h);
            renderHealthView();
        }

        async function renderDiaryView() {
            const entries = await dbGetAll('diary');
            document.getElementById('app-content').innerHTML = `
                <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold gold-gradient-text"><i class="fa-solid fa-book-bookmark"></i> ডায়েরি</h2></div>
                <div class="glass-card p-5 rounded-2xl space-y-3">
                    <input id="diary-title" type="text" placeholder="শিরোনাম..." class="w-full p-3 rounded-xl bg-navy-900/60 border border-gold-500/20 text-xs focus:outline-none">
                    <textarea id="diary-content" placeholder="অনুভূতি..." class="w-full p-3 rounded-xl bg-navy-900/60 border border-gold-500/20 text-xs focus:outline-none" rows="3"></textarea>
                    <button onclick="saveDiary()" class="w-full py-2.5 rounded-xl bg-gold-500 text-navy-900 font-bold text-xs">সংরক্ষণ</button>
                </div>
                <div class="space-y-3">
                    ${entries.map(e => `<div class="glass-card p-4 rounded-xl text-xs"><h4 class="font-bold text-gold-400">${e.title}</h4><p class="text-slate-300 mt-1">${e.content}</p></div>`).join('')}
                </div>
            `;
        }
        async function saveDiary() {
            const title = document.getElementById('diary-title').value.trim();
            const content = document.getElementById('diary-content').value.trim();
            if(!title || !content) return;
            await dbPut('diary', { id: Date.now().toString(), title, content, timestamp: new Date().toISOString() });
            renderDiaryView();
        }

        function renderMenuView() {
            document.getElementById('app-content').innerHTML = `
                <div class="mb-4"><h2 class="text-xl font-bold gold-gradient-text">অতিরিক্ত মডিউলসমূহ</h2></div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <button onclick="switchTab('backup')" class="glass-card p-5 rounded-2xl text-left text-xs"><i class="fa-solid fa-database text-gold-500 text-lg mb-1"></i><h3 class="font-bold">ব্যাকআপ ও রিস্টোর</h3></button>
                    <button onclick="switchTab('settings')" class="glass-card p-5 rounded-2xl text-left text-xs"><i class="fa-solid fa-sliders text-gold-500 text-lg mb-1"></i><h3 class="font-bold">প্রোফাইল সেটিংস</h3></button>
                </div>
            `;
        }

        function renderBackupView() {
            document.getElementById('app-content').innerHTML = `
                <div class="glass-card p-5 rounded-2xl text-xs space-y-3">
                    <h3 class="font-bold">ব্যাকআপ</h3>
                    <button onclick="exportJSON()" class="py-2.5 px-4 bg-gold-500 text-navy-900 font-bold rounded-xl">JSON ডাউনলোড</button>
                </div>
            `;
        }
        async function exportJSON() {
            const data = {};
            for (let store of ['todos', 'habits', 'vocab', 'diary', 'health', 'settings', 'conversations']) {
                data[store] = await dbGetAll(store);
            }
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'hayat_backup.json'; a.click();
        }

        async function renderSettingsView() {
            const profile = (await dbGet('settings', 'profile')) || { name: 'জ্ঞান অন্বেষণকারী', motto: 'নিরবচ্ছিন্ন আত্মউন্নয়ন' };
            document.getElementById('app-content').innerHTML = `
                <div class="glass-card p-5 rounded-2xl space-y-3 text-xs">
                    <h3 class="font-bold text-gold-400">প্রোফাইল</h3>
                    <input id="set-name" type="text" value="${profile.name}" class="w-full p-2.5 rounded-xl bg-navy-900 border border-gold-500/20">
                    <input id="set-motto" type="text" value="${profile.motto}" class="w-full p-2.5 rounded-xl bg-navy-900 border border-gold-500/20">
                    <button onclick="saveProfile()" class="py-2 px-4 bg-gold-500 text-navy-900 font-bold rounded-xl">সংরক্ষণ</button>
                </div>
            `;
        }
        async function saveProfile() {
            const name = document.getElementById('set-name').value;
            const motto = document.getElementById('set-motto').value;
            await dbPut('settings', { key: 'profile', name, motto });
            showToast('প্রোফাইল সংরক্ষিত হয়েছে');
        }

        function renderCalendarView() { document.getElementById('app-content').innerHTML = `<div class="glass-card p-5 rounded-2xl text-xs">ক্যালেন্ডার মডিউল</div>`; }
        function renderGoalsView() { document.getElementById('app-content').innerHTML = `<div class="glass-card p-5 rounded-2xl text-xs">লক্ষ্য মডিউল</div>`; }
        function renderReportsView() { document.getElementById('app-content').innerHTML = `<div class="glass-card p-5 rounded-2xl text-xs">রিপোর্ট মডিউল</div>`; }

        // --- INIT ---
        window.addEventListener('DOMContentLoaded', async () => {
            loadThemePreference();
            await initDB();
            switchTab('dashboard');
        });
    </script>
</body>
</html>
