<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAZARO - এক বাজারে সবকিছু</title>
  
  <!-- PWA Manifest & Theme Color -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#ff9800">
  
  <!-- FontAwesome Icons & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', 'Segoe UI', sans-serif; }
    body { background: #0a0f1d; color: #ffffff; padding-bottom: 80px; }

    /* Premium Header */
    header {
      background: linear-gradient(135deg, #161f38, #0b132b);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 152, 0, 0.2);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 42px; height: 42px; border-radius: 10px; border: 2px solid #ff9800; }
    .brand-title { font-size: 24px; font-weight: 700; color: #ff9800; letter-spacing: 1px; }
    .brand-sub { font-size: 11px; color: #cbd5e1; margin-top: -3px; }
    
    .header-actions { display: flex; align-items: center; gap: 15px; }
    .cart-icon { position: relative; font-size: 22px; color: #ff9800; cursor: pointer; transition: transform 0.2s; }
    .cart-icon:hover { transform: scale(1.1); }
    .cart-count {
      position: absolute; top: -8px; right: -10px; background: #e53e3e;
      color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; font-weight: bold;
    }

    /* Main Container */
    .container { padding: 15px; max-width: 1200px; margin: auto; }

    /* Modern Search Bar */
    .search-box {
      display: flex; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,152,0,0.3);
      border-radius: 12px; overflow: hidden; margin-bottom: 25px; backdrop-filter: blur(5px);
    }
    .search-box input {
      flex: 1; border: none; padding: 12px 16px; outline: none; font-size: 14px; color: #fff; background: transparent;
    }
    .search-box input::placeholder { color: #94a3b8; }
    .search-box button {
      background: linear-gradient(135deg, #ff9800, #e67e22); border: none; padding: 0 20px; color: white; font-size: 16px; cursor: pointer;
    }

    /* Section Titles */
    .section-title {
      font-size: 19px; font-weight: 700; margin-bottom: 15px; color: #ff9800;
      display: flex; align-items: center; gap: 8px;
    }
    .section-title i { font-size: 16px; }

    /* Categories Horizontal Scroll */
    .categories-grid {
      display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 30px;
      scrollbar-width: thin; scrollbar-color: #ff9800 transparent;
    }
    .category-card {
      min-width: 95px; background: #161f38; border: 1px solid rgba(255,255,255,0.05);
      border-radius: 14px; padding: 12px 8px; text-align: center; cursor: pointer;
      flex-shrink: 0; transition: all 0.3s ease;
    }
    .category-card:hover { transform: translateY(-4px); border-color: #ff9800; background: #1c284e; }
    .category-card img { width: 45px; height: 45px; object-fit: contain; margin-bottom: 6px; border-radius: 8px; }
    .category-card span { font-size: 12px; display: block; color: #e2e8f0; font-weight: 600; white-space: nowrap; }

    /* Product Grid */
    .products-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 16px;
    }
    .product-card {
      background: #161f38; border-radius: 14px; overflow: hidden; display: flex;
      flex-direction: column; justify-content: space-between; border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 8px 16px rgba(0,0,0,0.2); transition: all 0.3s ease;
    }
    .product-card:hover { transform: translateY(-5px); border-color: rgba(255,152,0,0.5); }
    .product-img-box { position: relative; width: 100%; height: 160px; background: #ffffff; overflow: hidden; }
    .product-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
    .product-card:hover img { transform: scale(1.05); }
    
    .product-info { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .product-title { font-size: 14px; font-weight: 600; color: #f8fafc; height: 40px; overflow: hidden; line-height: 1.3; margin-bottom: 8px; }
    .price-box { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
    .main-price { font-size: 17px; font-weight: 700; color: #ff9800; }
    .old-price { font-size: 12px; color: #64748b; text-decoration: line-through; }
    
    .btn-buy {
      width: 100%; background: linear-gradient(135deg, #ff9800, #f39c12); color: #0b132b; border: none; padding: 9px;
      border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.2s;
    }
    .btn-buy:hover { background: linear-gradient(135deg, #f39c12, #e67e22); color: #fff; }

    /* Floating WhatsApp Button */
    .whatsapp-btn {
      position: fixed; bottom: 80px; right: 20px; background: #25d366; color: white;
      width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 28px; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4); z-index: 999;
      text-decoration: none; transition: transform 0.3s;
    }
    .whatsapp-btn:hover { transform: scale(1.1); }

    /* Customer Bottom Navigation */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: #161f38;
      display: flex; justify-content: space-around; padding: 10px 0;
      border-top: 1px solid rgba(255,152,0,0.2); z-index: 1000; box-shadow: 0 -4px 15px rgba(0,0,0,0.3);
    }
    .nav-item { text-align: center; color: #94a3b8; text-decoration: none; font-size: 11px; font-weight: 600; cursor: pointer; transition: color 0.2s; }
    .nav-item i { font-size: 19px; display: block; margin-bottom: 3px; }
    .nav-item.active, .nav-item:hover { color: #ff9800; }

    /* PWA Install Banner Style */
    #pwa-install-banner {
      display: none; position: fixed; bottom: 70px; left: 15px; right: 15px;
      background: linear-gradient(135deg, #ff9800, #e67e22); color: white; padding: 12px 16px; border-radius: 12px;
      z-index: 9999; justify-content: space-between; align-items: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <img src="https://zwpoxufpeluqtdooeekr.supabase.co/storage/v1/object/public/products/1775317765955.png" onerror="this.src='https://img.icons8.com/color/512/shopping-bag.png'">
      <div>
        <div class="brand-title">BAZARO</div>
        <div class="brand-sub">এক বাজারে সবকিছু</div>
      </div>
    </div>
    <div class="header-actions">
      <div class="cart-icon" onclick="openCart()">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-count" id="cart-count">0</span>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- Search Bar -->
    <div class="search-box">
      <input type="text" id="search-input" onkeyup="filterProducts()" placeholder="পণ্য বা ক্যাটাগরি খুঁজুন...">
      <button><i class="fas fa-search"></i></button>
    </div>

    <!-- Categories -->
    <div class="section-title"><i class="fas fa-th-large"></i> ক্যাটাগরিসমূহ</div>
    <div class="categories-grid" id="categories-container">
      <!-- Dynamic Categories Loading -->
    </div>

    <!-- Products List -->
    <div class="section-title"><i class="fas fa-bolt"></i> জনপ্রিয় পণ্যসমূহ</div>
    <div class="products-grid" id="products-container">
      <div style="grid-column: 1/-1; text-align: center; padding: 30px; color: #94a3b8;">
        <i class="fas fa-spinner fa-spin fa-2x"></i><br><br>পণ্য লোড হচ্ছে...
      </div>
    </div>
  </div>

  <!-- WhatsApp Chat Button -->
  <a href="https://wa.me/8801800000000?text=Hello%20BAZARO,%20I%20have%20a%20query" target="_blank" class="whatsapp-btn" title="WhatsApp-এ মেসেজ দিন">
    <i class="fab fa-whatsapp"></i>
  </a>

  <!-- Customer Bottom Navigation -->
  <div class="bottom-nav">
    <div class="nav-item active" onclick="navClick('home')"><i class="fas fa-home"></i>হোম</div>
    <div class="nav-item" onclick="navClick('category')"><i class="fas fa-list-ul"></i>ক্যাটাগরি</div>
    <div class="nav-item" onclick="openCart()"><i class="fas fa-shopping-bag"></i>কার্ট</div>
    <div class="nav-item" onclick="navClick('orders')"><i class="fas fa-truck"></i>অর্ডার</div>
    <div class="nav-item" onclick="navClick('profile')"><i class="fas fa-user-circle"></i>প্রোফাইল</div>
  </div>

  <!-- PWA Auto Install Banner -->
  <div id="pwa-install-banner">
    <div style="display:flex; align-items:center; gap:12px;">
      <img src="https://zwpoxufpeluqtdooeekr.supabase.co/storage/v1/object/public/products/1775317765955.png" style="width:40px; height:40px; border-radius:8px; object-fit:cover; background:#fff;" onerror="this.src='https://img.icons8.com/color/512/shopping-bag.png'">
      <div>
        <div style="font-weight:bold; font-size:14px; color:#0b132b;">BAZARO App</div>
        <div style="font-size:11px; color:#1e293b;">ফোন অ্যাপ হিসেবে ইনস্টল করুন</div>
      </div>
    </div>
    <button id="btn-pwa-install" style="background:#0b132b; color:white; border:none; padding:8px 14px; border-radius:8px; font-weight:bold; cursor:pointer; font-size:12px;">ইনস্টল</button>
  </div>

  <script>
    // Supabase Initialization
    const SUPABASE_URL = "https://zwpoxufpeluqtdooeekr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_TACq2hE6EHAx88w00X74XA_XQTMI1bW";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allProducts = [];
    let cartCount = 0;

    // Load Products & Categories
    async function loadData() {
      try {
        // Categories
        const { data: categories } = await supabaseClient.from('categories').select('*');
        const catContainer = document.getElementById('categories-container');
        if (categories && categories.length > 0) {
          catContainer.innerHTML = categories.map(c => `
            <div class="category-card" onclick="filterByCategory('${c.name}')">
              <img src="${c.image_url}" onerror="this.src='https://img.icons8.com/color/512/category.png'">
              <span>${c.name}</span>
            </div>
          `).join('');
        } else {
          catContainer.innerHTML = '<div style="font-size:13px; color:#94a3b8; padding: 10px;">কোনো ক্যাটাগরি পাওয়া যায়নি</div>';
        }

        // Products
        const { data: products } = await supabaseClient.from('products').select('*').order('id', {ascending: false});
        allProducts = products || [];
        renderProducts(allProducts);

      } catch (error) {
        console.error("Data load error:", error);
      }
    }

    function renderProducts(products) {
      const prodContainer = document.getElementById('products-container');
      if (products && products.length > 0) {
        prodContainer.innerHTML = products.map(p => `
          <div class="product-card">
            <div class="product-img-box">
              <img src="${p.image_url}" onerror="this.src='https://img.icons8.com/color/512/product.png'">
            </div>
            <div class="product-info">
              <div class="product-title">${p.name}</div>
              <div class="price-box">
                <span class="main-price">৳${p.discount_price || p.price}</span>
                ${p.discount_price ? `<span class="old-price">৳${p.price}</span>` : ''}
              </div>
              <button class="btn-buy" onclick="addToCart('${p.name}')">
                <i class="fas fa-cart-plus"></i> অর্ডার করুন
              </button>
            </div>
          </div>
        `).join('');
      } else {
        prodContainer.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 30px; color: #94a3b8;">কোনো পণ্য পাওয়া যায়নি!</div>';
      }
    }

    // Filter Functions
    function filterProducts() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query));
      renderProducts(filtered);
    }

    function filterByCategory(catName) {
      const filtered = allProducts.filter(p => p.category === catName);
      renderProducts(filtered.length > 0 ? filtered : allProducts);
    }

    // Cart and Nav Actions
    function addToCart(pName) {
      cartCount++;
      document.getElementById('cart-count').innerText = cartCount;
      alert(`"${pName}" আপনার কার্টে যুক্ত করা হয়েছে!`);
    }

    function openCart() {
      alert(`আপনার কার্টে মোট ${cartCount} টি পণ্য রয়েছে।`);
    }

    function navClick(type) {
      if(type === 'home') {
        renderProducts(allProducts);
      } else if(type === 'orders') {
        alert("আপনার পূর্বের অর্ডারের তালিকা দেখতে শীঘ্রই লগইন ফিচার যুক্ত হচ্ছে।");
      } else if(type === 'profile') {
        alert("গ্রাহক প্রোফাইল অপশন চালু রয়েছে।");
      } else if(type === 'category') {
        window.scrollTo({ top: 150, behavior: 'smooth' });
      }
    }

    loadData();

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(err => console.log('SW error:', err));
      });
    }

    // PWA Banner Trigger Logic
    let deferredPrompt;
    const installBanner = document.getElementById('pwa-install-banner');
    const installBtn = document.getElementById('btn-pwa-install');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBanner.style.display = 'flex';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBanner.style.display = 'none';
      } else {
        alert('আপনার ব্রাউজারের ৩-ডট (⋮) মেনুতে ক্লিক করে "Add to Home screen" বা "Install App"-এ চাপ দিন।');
      }
    });

    window.addEventListener('appinstalled', () => {
      installBanner.style.display = 'none';
    });
  </script>
</body>
</html>
